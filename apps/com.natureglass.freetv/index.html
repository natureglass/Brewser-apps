<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free TV</title>
<style>
  :root {
    --bg: #0a0716;
    --panel: #0e0a1d;
    --panel-2: #17112f;
    --border: #2e1f57;
    --border-soft: #211646;
    --text: #f3eefc;
    --muted: #a89cc4;
    --faint: #6d6289;
    --amber: #EFA227;
    --amber-hi: #F7BE5C;
    --amber-ink: #2a1a02;
    --green: #5ad39a;
    --danger: #ff5f6d;
    --radius: 10px;
    --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.35;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; }
  button:focus, input:focus, [tabindex]:focus { outline: none; }
  .focus-ring { outline: 2px solid var(--amber) !important; }

  /* ---------- shell ---------- */
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 14px;
    height: 56px; padding: 0 20px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .name { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .brand .name b { color: var(--amber); font-weight: 700; }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .crumbs { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .crumbs span { color: var(--text); }
  header .spacer { flex: 1; }
  .hint { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .hint kbd {
    display: inline-block; min-width: 20px; padding: 1px 6px; margin-right: 2px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2);
    color: var(--muted); font-family: inherit; font-size: 11px; text-align: center;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; white-space: nowrap;
  }
  .btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.icon { padding: 6px 9px; }
  .btn[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
  .btn:active, .tile:active, .country:active, .ch:active, .chip:active { background: var(--border); }
  .btn:disabled { opacity: .5; cursor: default; }

  main { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ---------- home ---------- */
  #home { flex-direction: column; padding: 28px 40px; gap: 22px; overflow: auto; }
  #home .lead { max-width: 60ch; color: var(--muted); font-size: 15px; margin: 0; }
  .tiles {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    max-width: 1100px; padding: 4px;
  }
  .tile {
    text-align: left; position: relative;
    height: 150px; padding: 18px 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .tile .mark {
    font-size: 30px; font-weight: 800; letter-spacing: -.02em;
    color: var(--amber);
  }
  .tile .title { font-size: 20px; font-weight: 600; }
  .tile .meta { color: var(--muted); font-size: 13px; }
  .tile.fav .mark { color: var(--amber-hi); }
  .tile.open .mark { color: var(--green); }
  .cache-note { color: var(--faint); font-size: 13px; }

  /* ---------- country picker ---------- */
  #pick { flex-direction: column; padding: 22px 40px; gap: 16px; }
  #pick .toolbar { display: flex; align-items: center; gap: 12px; }
  #pick h2 { margin: 0; font-size: 22px; font-weight: 600; }
  .search {
    padding: 9px 12px; border-radius: 8px; width: 320px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  .search::placeholder { color: var(--faint); }
  .countries {
    flex: 1; min-height: 0; overflow: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px; align-content: start; padding-bottom: 20px;
  }
  .country {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 12px 14px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--border-soft);
  }
  .country .cname { font-size: 15px; font-weight: 500; }
  .country .ccode { color: var(--faint); font-size: 12px; margin-left: auto; }

  /* ---------- watch ---------- */
  #watch { flex-direction: row; }
  aside {
    /* 450 (was 420): the three filter toggles need ~404px on one line and
       420 left only 392 inside the padding, so "720p max" folded to its own
       row. Costs 30px of stage width; the video is letterboxed into that
       area anyway, so it loses nothing visible. */
    width: 450px; flex: 0 0 450px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border-soft);
  }
  .side-top { padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border-soft); }
  .side-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .side-row .search { flex: 1; width: auto; min-width: 120px; }
  /* Filter toggles: one row, equal thirds. Sharing the width explicitly
     beats relying on each label's measured width - the three stay aligned,
     and a font whose metrics differ slightly from ours can't re-introduce
     the fold. Narrow layouts restore wrapping in the max-width query below. */
  .side-row.filters { flex-wrap: nowrap; }
  .side-row.filters .btn { flex: 1 1 0; min-width: 0; justify-content: center; padding-left: 4px; padding-right: 4px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px; }
  .chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
  .chip[aria-pressed="true"] span { color: var(--amber-ink) !important; }
  .list { flex: 1; min-height: 0; overflow: auto; padding: 4px; }
  .list .empty { padding: 30px 20px; color: var(--muted); font-size: 14px; }
  .ch {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 9px 14px; border-bottom: 1px solid var(--border-soft);
  }
  .ch .cn { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch .badges { display: flex; gap: 4px; flex: 0 0 auto; }
  .badge {
    font-size: 11px; padding: 2px 6px; border-radius: 5px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .badge.res { color: var(--text); }
  .badge.geo { color: var(--amber-hi); border-color: #6b4a12; }
  .badge.off { color: var(--danger); border-color: #6b2a30; }
  .ch .star { flex: 0 0 auto; color: var(--faint); font-size: 16px; width: 22px; text-align: center; }
  .ch.isfav .star { color: var(--amber); }
  .ch.playing { background: var(--panel-2); }
  .ch.playing .cn { color: var(--amber-hi); }
  .ch.broken .cn { color: var(--faint); }
  .side-foot { padding: 8px 14px; border-top: 1px solid var(--border-soft); color: var(--faint); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  /* Pager. The list is hard-capped at PAGE_SIZE rows because a 1000+ row
     list collapses the frame rate and can take the app down with it. */
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; border-top: 1px solid var(--border-soft); }
  .pager span { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .pager .btn[disabled] { opacity: .4; }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #000; position: relative; }
  .stage-head {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .stage-head .now { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .stage-head .now .t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage-head .now .s { color: var(--muted); font-size: 13px; }
  .stage-head .logo { height: 28px; max-width: 90px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
  .tv { flex: 1; min-height: 0; position: relative; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .osd {
    position: absolute; left: 18px; top: 16px; padding: 6px 12px;
    background: rgba(10,7,22,.78); border: 1px solid var(--border); border-radius: 8px;
    color: var(--amber-hi); font-size: 18px; font-weight: 600;
    opacity: 0; transition: opacity .25s;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  .osd.show { opacity: 1; }
  .status {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: var(--muted); text-align: center; padding: 30px;
    background: rgba(10,7,22,.65);
  }
  .status.show { display: flex; }
  .status .big { font-size: 20px; color: var(--text); font-weight: 600; }
  .status .why { font-size: 14px; max-width: 48ch; }
  .dot {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--amber);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; border-top-color: var(--amber); } }

  /* ---------- drawer (landscape phone only) ---------- */
  .menu-btn {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; width: 38px; height: 32px; padding: 0; flex: 0 0 auto;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  }
  .menu-btn i { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; }
  .menu-btn[aria-expanded="true"] { background: var(--amber); border-color: var(--amber); }
  .menu-btn[aria-expanded="true"] i { background: var(--amber-ink); }
  .side-scrim { display: none; }

  /* ---------- fullscreen ---------- */
  body.fs header, body.fs aside, body.fs .stage-head, body.fs .side-scrim { display: none; }
  body.fs main { position: fixed; inset: 0; }
  body.fs .stage { border: 0; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 9px 16px; border-radius: 8px; font-size: 14px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    aside { width: 320px; flex-basis: 320px; }
    /* At 320px a third of the row is ~97px - narrower than "Only Favorites"
       renders - so let them wrap again rather than clip. */
    .side-row.filters { flex-wrap: wrap; }
    .side-row.filters .btn { flex: 0 0 auto; padding-left: 10px; padding-right: 10px; }
    .hint { display: none; }
  }

  /* ---------- landscape phone ---------- */
  @media (orientation: landscape) and (max-height: 500px) {

    /* one app-sized surface: nothing but the inner panes may scroll */
    html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
    #app { height: 100%; height: 100dvh; }

    /* --- header --- */
    header { height: 44px; padding: 0 10px; gap: 8px; }
    .brand { gap: 6px; }
    .brand .name { font-size: 16px; }
    .brand .sub { display: none; }
    .crumbs { font-size: 12px; gap: 6px; }
    .hint { display: none; }
    .btn.small { padding: 4px 9px; font-size: 12px; }
    body.on-watch .menu-btn { display: inline-flex; }

    /* --- home --- */
    #home { padding: 14px 16px; gap: 12px; }
    #home .lead { font-size: 13px; max-width: none; }
    .tiles { grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: none; padding: 4px; }
    .tile { height: auto; min-height: 92px; padding: 10px 12px; border-radius: 10px; }
    .tile .mark { font-size: 20px; }
    .tile .title { font-size: 15px; }
    .tile .meta { font-size: 11px; }
    .cache-note { font-size: 11px; }

    /* --- country picker --- */
    #pick { padding: 12px 16px; gap: 10px; }
    #pick h2 { font-size: 17px; }
    #pick .toolbar { gap: 8px; }
    .search { width: 190px; padding: 6px 10px; font-size: 13px; }
    .countries { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 8px; }
    .country { padding: 8px 10px; gap: 8px; }
    .country .cname { font-size: 13px; }

    /* --- watch: the aside becomes a slide-over drawer above the video --- */
    aside {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 12;
      width: 78%; max-width: 340px; flex: 0 0 auto;
      border-right: 1px solid var(--border);
      box-shadow: 0 0 24px rgba(0, 0, 0, .55);
      transform: translateX(-102%);
      transition: transform .22s ease;
    }
    body.nav-open aside { transform: translateX(0); }
    .side-scrim {
      display: block; position: absolute; inset: 0; z-index: 11;
      background: rgba(6, 4, 14, .55);
      opacity: 0; pointer-events: none; transition: opacity .22s ease;
    }
    body.nav-open .side-scrim { opacity: 1; pointer-events: auto; }

    .side-top { padding: 8px 10px 6px; gap: 6px; }
    .side-row { gap: 6px; }
    .side-row .search { width: auto; min-width: 0; }
    /* Drawer caps the panel at 340px and can apply above 900px wide (a
       landscape tablet), where the max-width query above doesn't fire - so
       restore wrapping here too rather than clip the labels. */
    .side-row.filters { flex-wrap: wrap; }
    .side-row.filters .btn { flex: 0 0 auto; padding-left: 9px; padding-right: 9px; }
    .chip { padding: 4px 9px; font-size: 12px; }
    .ch { padding: 7px 10px; gap: 8px; }
    .ch .cn { font-size: 13px; }
    .ch .star { width: 18px; font-size: 14px; }
    .badge { font-size: 10px; padding: 1px 5px; }
    .side-foot { padding: 5px 10px; font-size: 11px; }
    .pager { padding: 4px 10px; }

    .stage-head { padding: 6px 10px; gap: 8px; }
    .stage-head .now .t { font-size: 14px; }
    .stage-head .now .s { font-size: 11px; }
    .stage-head .logo { height: 22px; max-width: 64px; }
    .osd { left: 10px; top: 10px; padding: 4px 9px; font-size: 14px; }
    .status { gap: 10px; padding: 16px; }
    .status .big { font-size: 16px; }
    .status .why { font-size: 12px; }
    .dot { width: 30px; height: 30px; border-width: 2px; }
    .toast { bottom: 12px; padding: 6px 12px; font-size: 13px; }
    .focus-ring { outline: none!important; }
  }

  @media (prefers-reduced-motion: reduce) {
    aside, .side-scrim { transition: none; }
  }

</style>
</head>
<body>
<div id="app">
  <header>
    <button class="menu-btn" id="btnMenu" aria-label="Channel list" aria-expanded="false"><i></i><i></i><i></i></button>
    <div class="brand"><div class="name">Free <b>TV</b></div><div class="sub">public live channels</div></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="spacer"></div>
    <div class="hint" id="hint"></div>
    <button class="btn small" id="btnRefresh" title="Refresh channel lists">Refresh</button>
    <button class="btn small" id="btnHome" style="display:none">Exit</button>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen active" id="home">
      <p class="lead">Live channels that broadcasters and free streaming services publish openly. Pick a source, then a country. Lists come from the community-maintained iptv-org index and are cached on this device.</p>
      <div class="tiles" id="tiles"></div>
      <div class="cache-note" id="cacheNote"></div>
    </section>

    <!-- COUNTRY PICKER -->
    <section class="screen" id="pick">
      <div class="toolbar">
        <h2 id="pickTitle">Choose a country</h2>
        <button class="btn small" id="btnPickBack" style="display:none">Back</button>
        <div class="spacer" style="flex:1"></div>
        <div class="cache-note" id="pickNote"></div>
      </div>
      <div class="countries" id="countries"></div>
    </section>

    <!-- WATCH -->
    <section class="screen" id="watch">
      <aside>
        <div class="side-top">
          <div class="side-row">
            <button class="btn small" id="btnCountry">Change country</button>
            <input class="search" id="chSearch" placeholder="Filter channels" autocomplete="off">
          </div>
          <div class="side-row filters">
            <button class="btn small" id="fFav" aria-pressed="false">Only Favorites</button>
            <button class="btn small" id="fHide" aria-pressed="true">Only Available</button>
            <button class="btn small" id="f720" aria-pressed="false">720p max</button>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="list" id="list"></div>
        <div class="pager" id="pager" hidden>
          <button class="btn small" id="pgPrev">Prev</button>
          <span id="pgLabel"></span>
          <button class="btn small" id="pgNext">Next</button>
        </div>
        <div class="side-foot"><span id="count"></span><span id="updated"></span></div>
      </aside>
      <div class="side-scrim" id="sideScrim"></div>
      <div class="stage">
        <div class="stage-head">
          <div class="now" id="now"><span class="s">Pick a channel to start</span></div>
          <button class="btn small" id="btnFav" aria-pressed="false">Favorite</button>
          <button class="btn small" id="btnFs">Fullscreen</button>
        </div>
        <div class="tv">
          <video id="video" playsinline autoplay></video>
          <div class="osd" id="osd"></div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>

const RAW = 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/';
const CACHE_TTL = 24 * 3600 * 1000;
const FETCH_TIMEOUT = 15000;
// Must stay ABOVE the engine's own network read/write timeout (30s in
// nx_media_open) plus a little slack. At the old 20s the app gave up and
// blacklisted the channel while the decoder was still legitimately trying,
// so slow-but-working streams were recorded as dead.
const PLAY_TIMEOUT = 35000;
// How long a channel stays hidden after a failure. Split by cause: a 404 is
// gone and there is no point retrying it soon, while a timeout or a 5xx is
// usually the stream being briefly down. Previously a single failure of ANY
// kind hid a channel forever (the timestamp was written but never read), so
// the list could only ever shrink.
// Hard cap on rendered channel rows. Some country lists are enormous (India
// is ~1300 entries) and rendering them all drops the console to single-digit
// fps and can take the app down - the row count, not the data, is what costs.
// The full filtered list still drives search, counts and next/prev channel;
// only the DOM is paged.
const PAGE_SIZE = 80;
const BROKEN_TTL_HARD = 7 * 24 * 3600 * 1000;
const BROKEN_TTL_SOFT = 6 * 3600 * 1000;
const HARD_KINDS = { 'not-found': 1, 'not-found-local': 1, 'client-error': 1, 'bad-request': 1 };

/* ===================== HELPERS ===================== */
function $(id) { return document.getElementById(id); }
function loadJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function countryName(cc) { return COUNTRY_NAMES[cc] || cc.toUpperCase(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function ago(t) {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function fetchText(url) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), FETCH_TIMEOUT);
    fetch(url, { cache: 'no-store' }).then(r => {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(resolve).catch(e => { clearTimeout(timer); reject(e); });
  });
}

/* ===================== M3U ===================== */
function parseM3U(text, cc, sourceId) {
  const lines = text.split(/\r?\n/);
  const out = [];
  const seen = {};
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')) {
      const attrs = {};
      line.replace(/([a-zA-Z0-9-]+)="([^"]*)"/g, (m, k, v) => { attrs[k] = v; return ''; });
      const comma = line.lastIndexOf(',');
      let name = comma >= 0 ? line.slice(comma + 1).trim() : 'Unknown';
      const tags = []; name = name.replace(/\[([^\]]+)\]/g, (m, t) => { tags.push(t); return ''; });
      const resM = name.match(/\((\d{3,4})p\)/);
      const res = resM ? parseInt(resM[1], 10) : null;
      name = name.replace(/\s*\(\d{3,4}p\)/, '').replace(/\s{2,}/g, ' ').trim();
      const id = attrs['tvg-id'] || '';
      const origin = id ? (id.split('@')[0].split('.').pop() || '').toLowerCase() : '';
      cur = { name, id, res, geo: tags.includes('Geo-blocked'), not247: tags.includes('Not 24/7'),
              logo: attrs['tvg-logo'] || '', cc, origin: origin.length === 2 ? origin : cc, source: sourceId, headers: false, ref: '', url: '' };
    } else if (line.startsWith('#EXTVLCOPT')) {
      // Capture the referrer VALUE (the engine can send it; a browser cannot,
      // since Referer is a forbidden header name in the Fetch spec).
      //
      // The declared http-user-agent is deliberately NOT captured. Those
      // strings are pinned to whatever browser version was current when the
      // entry was added and several have gone stale: measured, 4 of 70
      // streams return 403 with the M3U's own UA and 200 with a current one.
      // The engine's default UA is strictly better, so we let it win.
      if (cur) {
        cur.headers = true;
        const m = line.match(/^#EXTVLCOPT:\s*http-referrer\s*=\s*(.+)$/i);
        if (m) cur.ref = m[1].trim();
      }
    } else if (line.startsWith('#')) {
      continue;
    } else if (cur) {
      cur.url = line;
      cur.key = cur.id || cur.url;
      if (seen[cur.key]) cur.key += '#' + (++seen[cur.key]); else seen[cur.key] = 1;
      out.push(cur); cur = null;
    }
  }
  return out;
}

async function loadFile(file, force) {
  const k = 'freetv.cache.' + file;
  const c = force ? null : loadJSON(k, null);
  if (c && Date.now() - c.t < CACHE_TTL) return c;
  const text = await fetchText(RAW + file);
  const entry = { t: Date.now(), text };
  saveJSON(k, entry);
  return entry;
}

/* ===================== DRAWER (landscape phone) ===================== */
// The aside is a slide-over panel only under the landscape-phone media query.
// On the Switch (720p tall) it stays a permanent column and none of this applies.
const DRAWER_MQ = '(orientation: landscape) and (max-height: 500px)';
function isDrawer() {
  try { if (window.matchMedia) return window.matchMedia(DRAWER_MQ).matches; } catch (e) {}
  return window.innerHeight <= 500 && window.innerWidth > window.innerHeight;
}
function inAside(el) {
  for (let n = el; n; n = n.parentNode) { if (n.tagName === 'ASIDE') return true; if (n === document.body) break; }
  return false;
}
function setNav(open) {
  document.body.classList.toggle('nav-open', !!open);
  $('btnMenu').setAttribute('aria-expanded', open ? 'true' : 'false');
  if (S.screen === 'watch') setTimeout(() => focusFirst('watch'), 0);
}
function toggleNav() { setNav(!document.body.classList.contains('nav-open')); }
$('btnMenu').addEventListener('click', toggleNav);
$('sideScrim').addEventListener('click', () => setNav(false));

/* ===================== NAVIGATION ===================== */
function show(screen) {
  // Leaving the watch screen tears the decoder down. Previously only
  // goHome() did this, so backing out to the country picker left a decoder
  // running - still pulling segments and decoding video for a screen nobody
  // is looking at, which made the whole system crawl. A decoder still in its
  // (blocking) open was the worst case.
  if (S.screen === 'watch' && screen !== 'watch') {
    stop();
    S.current = null;
    setStatus(null);
    $('now').innerHTML = '<span class="s">Pick a channel to start</span>';
  }
  S.screen = screen;
  document.body.classList.toggle('on-watch', screen === 'watch');
  if (screen !== 'watch') setNav(false);
  else if (isDrawer() && !S.current) setNav(true);  // arriving with nothing playing: show the list first
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === screen));
  $('btnHome').style.display = screen === 'home' ? 'none' : '';
  $('btnRefresh').textContent = screen === 'watch' ? 'Refresh list' : 'Refresh';
  const crumbs = [];
  if (S.source) crumbs.push(S.source.title);
  if (screen === 'watch' && S.cc) crumbs.push(countryName(S.cc));
  $('crumbs').innerHTML = crumbs.map(c => '<span>' + esc(c) + '</span>').join('<i style="color:var(--faint)">/</i>');
  $('hint').innerHTML = screen === 'home'
    ? '<kbd>A</kbd> open'
    : screen === 'pick' ? '<kbd>A</kbd> open <kbd>B</kbd> back'
    : '<kbd>A</kbd> play <kbd>Y</kbd> favorite <kbd>X</kbd> fullscreen <kbd>B</kbd> back';
  setTimeout(() => focusFirst(screen), 0);
}
function focusFirst(screen) {
  const root = $(screen);
  if (screen === 'watch' && isDrawer()) {
    const open = document.body.classList.contains('nav-open');
    const pref = open
      ? (root.querySelector('aside .ch.playing') || root.querySelector('aside .ch') || root.querySelector('aside .btn'))
      : (root.querySelector('.stage-head .btn') || $('btnMenu'));
    if (pref) setFocus(pref);
    return;
  }
  const pref = root.querySelector('.ch.playing') || (S.cc && root.querySelector('.country[data-cc="' + S.cc + '"]')) || root.querySelector('.tile, .country, .ch, .btn');
  if (pref) setFocus(pref);
}

/* ---------- home ---------- */
function renderHome() {
  $('tiles').innerHTML = SOURCES.map(s => {
    const meta = s.id === 'fav' ? (S.favs.length + (S.favs.length === 1 ? ' channel' : ' channels'))
               : s.countries.length + (s.countries.length === 1 ? ' country' : ' countries');
    return '<button class="tile ' + (s.cls || '') + '" data-src="' + s.id + '">' +
      '<div class="mark">' + esc(s.mark) + '</div>' +
      '<div><div class="title">' + esc(s.title) + '</div><div class="meta">' + esc(s.desc) + ' \u00b7 ' + meta + '</div></div></button>';
  }).join('');
  $('tiles').querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => openSource(b.dataset.src)));
  const n = Object.keys(localStorage).filter(k => k.startsWith('freetv.cache.')).length;
  $('cacheNote').textContent = n ? n + ' channel list' + (n === 1 ? '' : 's') + ' cached on this device. Refresh clears them.' : 'Nothing cached yet. Lists download when you open a country.';
}
function openSource(id) {
  S.source = SOURCES.find(s => s.id === id);
  if (id === 'fav') {
    S.cc = null;
    S.channels = S.favs.slice();
    S.updatedAt = null;
    S.filters.chip = null; S.filters.q = ''; $('chSearch').value = ''; S.page = 0;
    renderWatch();
    show('watch');
    return;
  }
  $('btnPickBack').style.display = 'none';
  renderCountries('');
  show('pick');
}

/* ---------- country picker ---------- */
function renderCountries(q) {
  const ql = q.trim().toLowerCase();
  const list = S.source.countries
    .map(cc => ({ cc, name: countryName(cc) }))
    .filter(c => !ql || c.name.toLowerCase().includes(ql) || c.cc.includes(ql))
    .sort((a, b) => a.name.localeCompare(b.name));
  $('countries').innerHTML = list.map(c =>
    '<button class="country" data-cc="' + c.cc + '">' +
    '<span class="cname">' + esc(c.name) + '</span><span class="ccode">' + c.cc.toUpperCase() + '</span></button>').join('')
    || '<div class="empty">No country matches that.</div>';
  $('countries').querySelectorAll('.country').forEach(b => b.addEventListener('click', () => openCountry(b.dataset.cc)));
  $('pickNote').textContent = list.length + (list.length === 1 ? ' country' : ' countries');
}
$('btnPickBack').addEventListener('click', () => show('watch'));

async function openCountry(cc, force) {
  S.cc = cc;
  S.filters.chip = null; S.filters.q = ''; $('chSearch').value = ''; S.page = 0;
  S.channels = [];
  renderWatch();
  show('watch');
  setStatus('spin', 'Loading ' + countryName(cc) + ' channels');
  try {
    const entry = await loadFile(S.source.file(cc), force);
    S.channels = parseM3U(entry.text, cc, S.source.id);
    S.updatedAt = entry.t;
    setStatus(null);
    renderWatch();
    if (!S.current) $('now').innerHTML = '<span class="s">' + S.channels.length + ' channels. Pick one to start.</span>';
  } catch (e) {
    setStatus('error', 'Could not download the channel list', 'Check the connection, then press Refresh. ' + (e.message || ''));
  }
}

/* ---------- watch ---------- */
/* ===================== UNAVAILABLE BOOKKEEPING ===================== */
// Entries are { t, kind }. Older builds stored a bare timestamp number, so
// read through a normaliser rather than migrating the stored blob.
function brokenEntry(key) {
  const v = S.broken[key];
  if (!v) return null;
  if (typeof v === 'number') return { t: v, kind: 'unknown' };
  return v;
}
function isBroken(ch) {
  const e = brokenEntry(ch.key);
  if (!e) return false;
  const ttl = HARD_KINDS[e.kind] ? BROKEN_TTL_HARD : BROKEN_TTL_SOFT;
  if (Date.now() - e.t < ttl) return true;
  // Expired: forget it so the channel comes back into the list on its own.
  delete S.broken[ch.key]; saveJSON('freetv.broken', S.broken);
  return false;
}
function isFav(ch) { return S.favs.some(f => f.key === ch.key); }
function toggleFav(ch) {
  if (!ch) return;
  if (isFav(ch)) { S.favs = S.favs.filter(f => f.key !== ch.key); toast('Removed from favorites'); }
  else { S.favs.push(ch); toast('Added to favorites'); }
  saveJSON('freetv.favs', S.favs);
  if (S.source && S.source.id === 'fav') S.channels = S.favs.slice();
  renderWatch(true);
}
function visibleChannels() {
  const f = S.filters, ql = f.q.trim().toLowerCase();
  return S.channels.filter(ch =>
    (!f.fav || isFav(ch)) &&
    // `ch.headers` deliberately NOT part of this test. Declaring an
    // EXTVLCOPT line is a weak predictor of failure, not a verdict: measured
    // over 70 such channels, 27 played with no headers at all, and the
    // engine now sends a browser User-Agent by default plus the declared
    // referrer. Hiding them on sight cost roughly 300 working channels.
    (!f.hide || !isBroken(ch)) &&
    (!f.low || (ch.res && ch.res <= 720)) &&
    (!f.chip || ch.origin === f.chip) &&
    (!ql || ch.name.toLowerCase().includes(ql)));
}
// Clamp the page into range for the given filtered list, then return the
// slice actually rendered. Filters can shrink the list under the current
// page (filter a 1300-entry country down to 12 while on page 5), so the
// clamp has to happen on every render, not only when the page changes.
// Last rendered list markup, so renderWatch can skip no-op DOM swaps.
let lastListHtml = null;
// Identity of the current filter/page view, to know when to reset scroll.
let lastViewKey = null;
// Swapping a container's innerHTML in place leaves the Brewser engine's
// baked overlay cache stale: the rows are in the DOM and the container still
// scrolls, but nothing repaints them and hit-testing keeps the OLD boxes, so
// rows render blank and/or refuse clicks. `__swbRepaint` resets that cache
// and forces a full repaint; the shell's own app-grid pager does exactly this
// for the same reason. No-op in a normal browser, which needs none of it.
function repaintUI() {
  try {
    const g = (typeof globalThis !== 'undefined' ? globalThis : null);
    const fn = (typeof window !== 'undefined' && window.__swbRepaint)
      || (g && g.__swbRepaint);
    if (typeof fn === 'function') fn();
  } catch (e) {}
}
function pageCount(vis) { return Math.max(1, Math.ceil(vis.length / PAGE_SIZE)); }
function clampPage(vis) {
  const n = pageCount(vis);
  if (S.page >= n) S.page = n - 1;
  if (S.page < 0) S.page = 0;
  return S.page;
}
function pageSlice(vis) {
  const p = clampPage(vis);
  return vis.slice(p * PAGE_SIZE, p * PAGE_SIZE + PAGE_SIZE);
}
// Move the page so that `ch` is on it. Used when next/prev channel walks off
// the current page - the selection drives the page, not the other way round.
function pageForChannel(vis, ch) {
  if (!ch) return;
  const i = vis.findIndex(c => c.key === ch.key);
  if (i >= 0) S.page = Math.floor(i / PAGE_SIZE);
}
function renderWatch(keepFocus) {
  const focusedKey = keepFocus && document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  // chips: countries of origin present in this list (only when more than one)
  const origins = {};
  S.channels.forEach(ch => { origins[ch.origin] = (origins[ch.origin] || 0) + 1; });
  const keys = Object.keys(origins).sort((a, b) => origins[b] - origins[a]);
  $('chips').innerHTML = keys.length > 1
    ? '<button class="chip" data-chip="" aria-pressed="' + (!S.filters.chip) + '">All</button>' +
      keys.map(k => '<button class="chip" data-chip="' + k + '" aria-pressed="' + (S.filters.chip === k) + '">' + esc(countryName(k)) + ' <span style="color:var(--faint)">' + origins[k] + '</span></button>').join('')
    : '';
  $('chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { S.filters.chip = b.dataset.chip || null; S.page = 0; renderWatch(); }));

  const vis = visibleChannels();
  const rows = pageSlice(vis);
  // Changing page or filters means a different slice of channels: send the
  // inner list back to the top. Without this the container keeps the old
  // scrollTop, which on a now-shorter list leaves you staring at blank space
  // below the rows.
  const viewKey = [S.page, S.filters.q, S.filters.fav, S.filters.hide, S.filters.low,
                   S.filters.chip || '', S.source && S.source.id, S.cc].join('|');
  if (viewKey !== lastViewKey) { lastViewKey = viewKey; try { $('list').scrollTop = 0; } catch (e) {} }
  const html = rows.length ? rows.map(ch => {
    const b = [];
    if (ch.res) b.push('<span class="badge res">' + ch.res + 'p</span>');
    if (ch.geo) b.push('<span class="badge geo">geo</span>');
    if (ch.not247) b.push('<span class="badge">not 24/7</span>');
    if (ch.headers) b.push('<span class="badge off">needs headers</span>');
    if (isBroken(ch)) b.push('<span class="badge off">unavailable</span>');
    const cls = ['ch', isFav(ch) ? 'isfav' : '', S.current && S.current.key === ch.key ? 'playing' : '', isBroken(ch) ? 'broken' : ''].join(' ');
    return '<button class="' + cls + '" data-key="' + esc(ch.key) + '">' +
      '<span class="cn">' + esc(ch.name) + '</span><span class="badges">' + b.join('') + '</span><span class="star">\u2605</span></button>';
  }).join('') : '<div class="empty">' + emptyText() + '</div>';
  // Only touch the DOM when the rendered rows actually changed. renderWatch
  // runs on every play/favorite/playing-event, and an in-place innerHTML swap
  // costs a full overlay-cache rebuild (see repaintUI) - skipping the no-op
  // case keeps that cost on real changes only, and leaves click handlers
  // attached instead of rebinding them every call.
  const listChanged = html !== lastListHtml;
  if (listChanged) {
    lastListHtml = html;
    $('list').innerHTML = html;
    $('list').querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => { play(findKey(b.dataset.key)); if (isDrawer()) setNav(false); }));
  }

  $('fFav').setAttribute('aria-pressed', S.filters.fav);
  $('fHide').setAttribute('aria-pressed', S.filters.hide);
  $('f720').setAttribute('aria-pressed', S.filters.low);
  // Pager: hidden entirely when everything fits on one page, so short lists
  // look exactly as they did before.
  const pages = pageCount(vis);
  const pg = $('pager');
  if (pages > 1) {
    const from = S.page * PAGE_SIZE + 1, to = Math.min(vis.length, (S.page + 1) * PAGE_SIZE);
    pg.hidden = false;
    $('pgLabel').textContent = from + '-' + to + ' of ' + vis.length;
    $('pgPrev').disabled = S.page <= 0;
    $('pgNext').disabled = S.page >= pages - 1;
  } else {
    pg.hidden = true;
  }
  $('count').textContent = vis.length + ' of ' + S.channels.length + ' channels';
  $('updated').textContent = S.updatedAt ? 'List updated ' + ago(S.updatedAt) : (S.source && S.source.id === 'fav' ? 'Saved on this device' : '');
  $('btnCountry').style.display = S.source && S.source.id === 'fav' ? 'none' : '';
  $('btnFav').setAttribute('aria-pressed', !!(S.current && isFav(S.current)));
  $('btnFav').textContent = S.current && isFav(S.current) ? 'Unfavorite' : 'Favorite';

  if (focusedKey) { const el = $('list').querySelector('.ch[data-key="' + CSS.escape(focusedKey) + '"]'); if (el) setFocus(el); }
  // Rows changed in place -> the engine's baked cache and hit-test boxes are
  // stale until told otherwise.
  if (listChanged) repaintUI();
}
function emptyText() {
  if (!S.channels.length) return S.source && S.source.id === 'fav' ? 'No favorites yet. Star a channel with Y or the star button.' : 'Loading\u2026';
  if (S.filters.fav) return 'No favorites in this list yet.';
  if (S.filters.q) return 'No channel matches that name.';
  return 'Every channel here is hidden by a filter. Turn off "Hide unavailable" to see them.';
}
function findKey(key) { return S.channels.find(c => c.key === key); }
$('pgPrev').addEventListener('click', () => { if (S.page > 0) { S.page--; renderWatch(); focusFirstRow(); } });
$('pgNext').addEventListener('click', () => { if (S.page < pageCount(visibleChannels()) - 1) { S.page++; renderWatch(); focusFirstRow(); } });
// After a page turn the previously focused row is gone, so put focus on the
// first row of the new page - otherwise D-pad navigation is stranded.
function focusFirstRow() {
  const el = $('list').querySelector('.ch');
  if (el) setFocus(el);
}
$('chSearch').addEventListener('input', e => { S.filters.q = e.target.value; S.page = 0; renderWatch(); });
$('fFav').addEventListener('click', () => { S.filters.fav = !S.filters.fav; S.page = 0; renderWatch(); });
$('fHide').addEventListener('click', () => { S.filters.hide = !S.filters.hide; S.page = 0; renderWatch(); });
$('f720').addEventListener('click', () => { S.filters.low = !S.filters.low; S.page = 0; renderWatch(); });
$('btnCountry').addEventListener('click', () => { $('btnPickBack').style.display = ''; renderCountries(''); show('pick'); });
$('btnFav').addEventListener('click', () => toggleFav(S.current));
$('btnFs').addEventListener('click', () => setFullscreen(!document.body.classList.contains('fs')));
$('btnHome').addEventListener('click', goHome);
$('btnRefresh').addEventListener('click', refresh);

function goHome() {
  stop();
  S.source = null; S.cc = null; S.channels = []; S.current = null;
  $('now').innerHTML = '<span class="s">Pick a channel to start</span>';
  renderHome();
  show('home');
}
async function refresh() {
  if (S.screen === 'watch' && S.cc) { await openCountry(S.cc, true); toast('Channel list refreshed'); return; }
  Object.keys(localStorage).filter(k => k.startsWith('freetv.cache.')).forEach(k => localStorage.removeItem(k));
  S.broken = {}; saveJSON('freetv.broken', S.broken);
  renderHome();
  toast('Cached lists cleared. They download again when you open a country.');
}

/* ===================== PLAYBACK ===================== */
const video = $('video');
let hlsLoading = null;
function nativeHls() { return !!video.canPlayType('application/vnd.apple.mpegurl') || !!video.canPlayType('application/x-mpegURL'); }
function loadHlsJs() {
  if (window.Hls) return Promise.resolve();
  if (hlsLoading) return hlsLoading;
  hlsLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = HLS_CDN; s.onload = res; s.onerror = () => rej(new Error('hls.js failed to load'));
    document.head.appendChild(s);
  });
  return hlsLoading;
}
let lastStatusHtml = '';
function setStatus(kind, big, why, cancel) {
  const st = $('status');
  if (!kind) {
    if (lastStatusHtml === '') return;
    lastStatusHtml = '';
    st.classList.remove('show'); st.innerHTML = '';
    repaintUI(); // clearing leaves the old text baked in the overlay cache
    return;
  }
  const html = (kind === 'spin' ? '<div class="dot"></div>' : '') +
    '<div class="big">' + esc(big) + '</div>' + (why ? '<div class="why">' + esc(why) + '</div>' : '') +
    (cancel ? '<button class="btn small" id="btnCancel">Cancel</button>' : '');
  if (html === lastStatusHtml) return;
  lastStatusHtml = html;
  st.innerHTML = html;
  st.classList.add('show');
  if (cancel) {
    const b = $('btnCancel');
    if (b) { b.addEventListener('click', cancelPlay); setTimeout(() => setFocus(b), 0); }
  }
  repaintUI();
}
// Abandon the channel currently being opened. The engine's decoder close is
// now interruptible, so this returns immediately even when the open is parked
// on an unreachable host; before, cancelling meant waiting out the timeout.
// Deliberately does NOT mark the channel unavailable - the user gave up, the
// stream didn't fail.
function cancelPlay() {
  if (!S.current) return;
  const name = S.current.name;
  stop();
  S.current = null;
  setStatus(null);
  $('now').innerHTML = '<span class="s">Pick a channel to start</span>';
  toast('Stopped ' + name);
  renderWatch(true);
  // Every branch above mutated the DOM in place (status cleared, now-playing
  // header replaced, the playing row's class dropped). Repaint last, after
  // the final mutation, so nothing is baked from a half-updated tree.
  repaintUI();
}
function stop() {
  clearTimeout(S.playTimer);
  if (S.hls) { try { S.hls.destroy(); } catch (e) {} S.hls = null; }
  try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
}
function showOsd(ch) {
  const o = $('osd');
  o.innerHTML = '<span>' + esc(ch.name) + '</span>' + (ch.res ? '<span class="badge res">' + ch.res + 'p</span>' : '');
  o.classList.add('show');
  clearTimeout(showOsd.t); showOsd.t = setTimeout(() => o.classList.remove('show'), 2500);
}
// Attempts to make for a channel, in order. The engine can send a Referer
// that a browser cannot, but a stale or wrong one is itself a way to get a
// 403 - so when a channel declares one, try with it and then without before
// concluding the channel is dead. Channels with no declared referrer have
// nothing to vary and get a single attempt.
function attemptsFor(ch) {
  return ch.ref ? [ch.ref, ''] : [''];
}
async function play(ch, attempt) {
  if (!ch) return;
  attempt = attempt || 0;
  stop();
  S.current = ch;
  S.attempt = attempt;
  $('now').innerHTML =
    (ch.logo ? '<img class="logo" src="' + esc(ch.logo) + '" alt="" onerror="this.remove()">' : '') +
    '<div style="min-width:0"><div class="t">' + esc(ch.name) + '</div><div class="s">' + esc(countryName(ch.origin)) + (ch.res ? ' \u00b7 ' + ch.res + 'p' : '') + (ch.geo ? ' \u00b7 may be geo-blocked' : '') + '</div></div>';
  renderWatch(true);
  showOsd(ch);
  setStatus('spin', 'Connecting to ' + ch.name, null, true);
  S.playTimer = setTimeout(() => failAttempt(ch, 'No video after ' + (PLAY_TIMEOUT / 1000) + ' seconds.'), PLAY_TIMEOUT);
  try {
    if (nativeHls() || /\.(mp4|webm|ogg|mp3|aac)(\?|$)/i.test(ch.url)) {
      // Brewser engine extension: the decoder reads this off the element at
      // open time and sends it as the Referer for the playlist AND every
      // rolling segment. No-op in a normal browser, which ignores the
      // unknown data- attribute and could not set Referer anyway.
      const ref = attemptsFor(ch)[attempt] || '';
      if (ref) video.setAttribute('data-http-referer', ref);
      else video.removeAttribute('data-http-referer');
      video.src = ch.url;
    } else {
      try { await loadHlsJs(); }
      catch (e) { clearTimeout(S.playTimer); setStatus('error', 'Player library not available', 'This browser needs hls.js from the CDN to play HLS streams and it could not be loaded. On the console the built-in player handles this natively.'); return; }
      if (S.current !== ch) return;
      const h = new Hls({ enableWorker: false });
      S.hls = h;
      h.on(Hls.Events.ERROR, (ev, data) => { if (data.fatal) failAttempt(ch, 'Stream error: ' + data.type); });
      h.loadSource(ch.url);
      h.attachMedia(video);
    }
    const p = video.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {
    failAttempt(ch, e.message || 'Playback failed');
  }
}
video.addEventListener('playing', () => {
  clearTimeout(S.playTimer);
  setStatus(null);
  if (S.current && S.broken[S.current.key]) { delete S.broken[S.current.key]; saveJSON('freetv.broken', S.broken); renderWatch(true); }
});
video.addEventListener('error', () => { if (S.current) failAttempt(S.current, 'The player could not open this stream.'); });
video.addEventListener('stalled', () => { if (S.current && !video.paused && video.readyState < 3) setStatus('spin', 'Buffering'); });
video.addEventListener('waiting', () => { if (S.current) setStatus('spin', 'Buffering'); });
// Engine classification of the failure, when the runtime provides it.
// Standard browsers expose MediaError with a numeric `code` only; Brewser
// adds `kind` (see nx_media_fail_kind). Absent either way, 'unknown'.
function failureKind() {
  try { return (video.error && video.error.kind) || 'unknown'; } catch (e) { return 'unknown'; }
}
// One attempt failed. Advance the ladder if another remains, otherwise
// record the channel as unavailable with the cause, so the TTL can be
// chosen by how permanent that cause is.
function failAttempt(ch, why) {
  if (S.current !== ch) return;
  const kind = failureKind();
  const next = (S.attempt || 0) + 1;
  if (next < attemptsFor(ch).length && !HARD_KINDS[kind]) {
    clearTimeout(S.playTimer);
    setStatus('spin', 'Retrying ' + ch.name, null, true);
    play(ch, next);
    return;
  }
  markBroken(ch, why, kind);
}
function markBroken(ch, why, kind) {
  if (S.current !== ch) return;
  clearTimeout(S.playTimer);
  stop();
  S.broken[ch.key] = { t: Date.now(), kind: kind || 'unknown' }; saveJSON('freetv.broken', S.broken);
  // The cause and whether a referrer was sent are shown on screen on purpose:
  // "forbidden" vs "timeout" vs "aborted" points at completely different
  // problems, and without it a failure is indistinguishable from any other.
  const diag = 'Cause: ' + (kind || 'unknown') + (ch.ref ? ' (referrer sent)' : '') + '.';
  setStatus('error', ch.name + ' is unavailable', why.replace(/[.!]?$/, '.') + ' ' + diag + ' It may be offline, geo-blocked, or use a format this device cannot decode. It is retried automatically later, or press Refresh to retry hidden channels now.');
  renderWatch(true);
}
function step(dir) {
  // Steps across the WHOLE filtered list, not just the rendered page; the
  // page follows the selection so the newly playing channel stays visible.
  const vis = visibleChannels();
  if (!vis.length) return;
  let i = S.current ? vis.findIndex(c => c.key === S.current.key) : -1;
  i = (i + dir + vis.length) % vis.length;
  pageForChannel(vis, vis[i]);
  play(vis[i]);
}

/* ===================== FULLSCREEN ===================== */
function setFullscreen(on) {
  if (on) document.body.classList.remove('nav-open'), $('btnMenu').setAttribute('aria-expanded', 'false');
  document.body.classList.toggle('fs', on);
  $('btnFs').textContent = on ? 'Exit fullscreen' : 'Fullscreen';
  try {
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) {}
  if (on && S.current) showOsd(S.current);
  if (!on) setTimeout(() => focusFirst('watch'), 0);
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) setFullscreen(false); });

/* ===================== INPUT: keyboard + gamepad, spatial focus ===================== */
let focused = null;
function setFocus(el) {
  if (focused && focused !== el) focused.classList.remove('focus-ring');
  focused = el;
  if (!el) return;
  el.classList.add('focus-ring');
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
  try { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
}
document.addEventListener('focusin', e => { const el = e.target; if (el && el !== focused && el.matches && el.matches('button, input')) setFocus(el); });
function focusables() {
  const root = document.body.classList.contains('fs') ? null : $(S.screen);
  if (!root) return [];
  const drawer = isDrawer() && S.screen === 'watch';
  const open = document.body.classList.contains('nav-open');
  const nodes = (drawer && open) ? [] : [...document.querySelectorAll('header button, header input')].filter(n => n.offsetParent !== null);
  root.querySelectorAll('button, input').forEach(n => {
    if (n.offsetParent === null) return;
    if (drawer && inAside(n) !== open) return;  // a translated-off drawer still reports a layout box
    nodes.push(n);
  });
  return nodes;
}
function moveFocus(dir) {
  const items = focusables();
  if (!items.length) return;
  if (!focused || !items.includes(focused)) { setFocus(items[0]); return; }
  const r = focused.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of items) {
    if (el === focused) continue;
    const b = el.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let dx = bx - cx, dy = by - cy, primary, secondary;
    if (dir === 'up')    { if (b.bottom > r.top + 4) continue;  primary = -dy; secondary = Math.abs(dx); }
    if (dir === 'down')  { if (b.top < r.bottom - 4) continue;  primary = dy;  secondary = Math.abs(dx); }
    if (dir === 'left')  { if (b.right > r.left + 4) continue;  primary = -dx; secondary = Math.abs(dy); }
    if (dir === 'right') { if (b.left < r.right - 4) continue;  primary = dx;  secondary = Math.abs(dy); }
    const score = primary + secondary * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) setFocus(best);
}
function action(name) {
  const fs = document.body.classList.contains('fs');
  if (name === 'back') {
    if (fs) return setFullscreen(false);
    // Engine-initiated fullscreen (double-tap on the video) does not set our
    // own `fs` class - the shell did it, not us. The shell handles B by
    // exiting that fullscreen, so we must NOT also navigate: doing both left
    // the app on another screen with the stream torn down, i.e. a black
    // screen. Let the shell own this press.
    try { if (document.fullscreenElement) return; } catch (e) {}
    if (isDrawer() && document.body.classList.contains('nav-open')) return setNav(false);
    if (S.screen === 'watch') return S.source && S.source.id === 'fav' ? goHome() : (S.cc ? ($('btnPickBack').style.display = '', renderCountries(''), show('pick')) : goHome());
    if (S.screen === 'pick') return S.cc && S.channels.length ? show('watch') : goHome();
    return;
  }
  if (name === 'fav') { const ch = focused && focused.classList.contains('ch') ? findKey(focused.dataset.key) : S.current; return toggleFav(ch); }
  if (name === 'fullscreen') { if (S.screen === 'watch') setFullscreen(!fs); return; }
  if (name === 'select') {
    if (fs) { if (S.current) showOsd(S.current); return; }
    if (focused && focused.tagName === 'BUTTON') focused.click();
    return;
  }
  if (name === 'up' || name === 'down') {
    if (fs) return step(name === 'up' ? -1 : 1);
    return moveFocus(name);
  }
  if (name === 'left' || name === 'right') { if (!fs) moveFocus(name); }
}
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT' && !['ArrowUp', 'ArrowDown', 'Escape'].includes(e.key)) {
    if (e.key === 'Enter') { e.preventDefault(); moveFocus('down'); }
    return;
  }
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'select', ' ': 'select',
                Escape: 'back', Backspace: 'back', f: 'fav', F: 'fav', x: 'fullscreen', X: 'fullscreen' };
  const a = map[e.key];
  if (a) { e.preventDefault(); action(a); }
});

// Gamepad polling with edge detection and d-pad/stick repeat.
const padState = { down: {}, repeatAt: {} };
const REPEAT_FIRST = 380, REPEAT_NEXT = 110;
function pollPads() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const now = performance.now();
  const pressed = {};
  for (const gp of pads) {
    if (!gp) continue;
    const b = i => gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > .5);
    if (b(PAD.A)) pressed.select = 1;
    if (b(PAD.B)) pressed.back = 1;
    if (b(PAD.Y)) pressed.fav = 1;
    if (b(PAD.X) || b(PAD.PLUS)) pressed.fullscreen = 1;
    if (b(PAD.UP) || (gp.axes[1] < -.6)) pressed.up = 1;
    if (b(PAD.DOWN) || (gp.axes[1] > .6)) pressed.down = 1;
    if (b(PAD.LEFT) || (gp.axes[0] < -.6)) pressed.left = 1;
    if (b(PAD.RIGHT) || (gp.axes[0] > .6)) pressed.right = 1;
  }
  for (const name of ['select', 'back', 'fav', 'fullscreen', 'up', 'down', 'left', 'right']) {
    const isDir = ['up', 'down', 'left', 'right'].includes(name);
    if (pressed[name]) {
      if (!padState.down[name]) { padState.down[name] = true; padState.repeatAt[name] = now + REPEAT_FIRST; action(name); }
      else if (isDir && now >= padState.repeatAt[name]) { padState.repeatAt[name] = now + REPEAT_NEXT; action(name); }
    } else padState.down[name] = false;
  }
  requestAnimationFrame(pollPads);
}
if (navigator.getGamepads) requestAnimationFrame(pollPads);

/* ===================== BOOT ===================== */
renderHome();
show('home');
</script>
</body>
</html>
