<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Fractal Zoom</title>
<style>
  /* Flat rendering only: solid fills + solid borders, no gradients/shadows/blur/transitions */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  #bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button {
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    color: #d8d8d8;
    background: #0a0a0a;
    border: 1px solid #3a3a3a;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  #bar button:hover  { background: #1a1a1a; }
  #bar button:active { background: #2a2a2a; border-color: #6a6a6a; }
  .chip {
    position: fixed;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #d8d8d8;
    background: #0a0a0a;
    border: 1px solid #3a3a3a;
    padding: 6px 10px;
    user-select: none;
    pointer-events: none;
  }
  #hud  { left: 12px;  bottom: 12px; }
  #hud b { color: #ffffff; font-weight: 600; }
  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #d8d8d8; font: 14px ui-monospace, monospace;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="bFractal">Fractal</button>
  <button id="bCycle">Cycle</button>
  <button id="bReset">Reset</button>
  <button id="bFull">Full screen</button>
</div>
<div id="hud" class="chip"><b id="fname">&mdash;</b> &nbsp;zoom &times;<span id="fzoom">1.0</span></div>
<div id="err">WebGL2 is not available in this browser.</div>

<script>
'use strict';

// ================= GL setup =================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) {
  document.getElementById('err').style.display = 'flex';
  throw new Error('no webgl2');
}
const extFloat = gl.getExtension('EXT_color_buffer_float'); // for the density accumulation buffer

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function locations(p, names){
  const o = {};
  for (const n of names) o[n] = gl.getUniformLocation(p, n);
  return o;
}

const PAL_GLSL = `
uniform vec3 u_palA, u_palB, u_palC, u_palD;
vec3 pal(float t){
  return u_palA + u_palB * cos(6.28318530718 * (u_palC * t + u_palD));
}`;

// ---------- program 1: escape-time / SDF fullscreen pass ----------
const VS_FS_TRI = `#version 300 es
layout(location=0) in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS_ESCAPE = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2  u_res;
uniform vec2  u_center;
uniform float u_scale;     // half-height of view in fractal space
uniform int   u_type;      // 0 mandel, 1 ship, 2 phoenix, 3 koch, 4 julia
uniform int   u_maxIter;   // escape iterations, or fold count for koch
uniform vec2  u_julia;
${PAL_GLSL}

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec3 kochColor(vec2 q){
  // iterated-fold SDF of the Koch snowflake (unit edge length, centered)
  q.x = abs(q.x);
  q.y += -0.5773503 * 0.5;                 // tan(5pi/6) * 0.5
  vec2 n = vec2(0.5, -0.8660254);          // (sin, cos)(5pi/6)
  q -= n * max(0.0, dot(q - vec2(0.5, 0.0), n)) * 2.0;
  n = vec2(0.8660254, -0.5);               // (sin, cos)(2pi/3)
  float sc = 1.0;
  q.x += 0.5;
  for (int i = 0; i < 40; i++){
    if (i >= u_maxIter) break;
    q *= 3.0; sc *= 3.0;
    q.x -= 1.5;
    q.x = abs(q.x);
    q.x -= 0.5;
    q -= n * min(0.0, dot(q, n)) * 2.0;
  }
  float d = length(q - vec2(clamp(q.x, -1.0, 1.0), 0.0)) / sc;

  float pxsz = (2.0 * u_scale) / u_res.y;             // fractal units per pixel
  float dn = pow(clamp(d / u_scale, 0.0, 1.0), 0.4);  // zoom-stable distance rings
  vec3 col = pal(dn * 0.85 + 0.05);
  return mix(vec3(1.0), col, smoothstep(0.0, 2.0 * pxsz, d)); // white curve line
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  vec2 p = u_center + uv * (2.0 * u_scale);

  vec3 col;
  if (u_type == 3){
    col = kochColor(p);
  } else {
    vec2 z, c;
    vec2 zp = vec2(0.0);
    if (u_type == 4)      { z = p;              c = u_julia; }
    else if (u_type == 2) { z = vec2(p.y, p.x); c = vec2(0.5667, -0.5); } // phoenix: c=(P,Q), axes swapped
    else                  { z = vec2(0.0);      c = p; }

    float m2 = 0.0;
    int n = -1;
    for (int i = 0; i < 1200; i++){
      if (i >= u_maxIter) break;
      float x = z.x, y = z.y;
      if (u_type == 1){                    // burning ship
        x = abs(x); y = abs(y);
        z = vec2(x*x - y*y, 2.0*x*y) + c;
      } else if (u_type == 2){             // phoenix: z' = z^2 + P + Q*z_prev
        float nx = x*x - y*y + c.x + c.y * zp.x;
        float ny = 2.0*x*y        + c.y * zp.y;
        zp = z;
        z = vec2(nx, ny);
      } else {                             // mandelbrot / julia: z' = z^2 + c
        z = vec2(x*x - y*y, 2.0*x*y) + c;
      }
      m2 = dot(z, z);
      if (m2 > 65536.0){ n = i; break; }
    }
    col = vec3(0.0);
    if (n >= 0){
      float sn = float(n) + 1.0 - log2(log(m2) * 0.5);
      col = pal(sn * 0.015);
    }
  }
  col += (hash12(gl_FragCoord.xy) - 0.5) * (1.0 / 255.0);
  outColor = vec4(col, 1.0);
}`;

// ---------- program 2: point splat (density fractals) ----------
const VS_POINT = `#version 300 es
layout(location=0) in vec3 a_pt;   // x,y relative to view center (fp64 subtract on CPU), palette coord
uniform vec2  u_res;
uniform float u_scale;
out float v_t;
void main(){
  vec2 uv = a_pt.xy / (2.0 * u_scale);
  gl_Position = vec4(uv.x * 2.0 * u_res.y / u_res.x, uv.y * 2.0, 0.0, 1.0);
  gl_PointSize = 1.0;
  v_t = a_pt.z;
}`;

const FS_POINT = `#version 300 es
precision highp float;
in float v_t;
out vec4 o;
uniform float u_gain;
${PAL_GLSL}
void main(){ o = vec4(pal(v_t) * u_gain, 1.0); }`;

// ---------- program 3: tonemap accumulation to screen ----------
const FS_TONE = `#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D u_acc;
uniform float u_exposure;
void main(){
  vec3 h = texelFetch(u_acc, ivec2(gl_FragCoord.xy), 0).rgb;
  vec3 col = 1.0 - exp(-h * u_exposure);
  col = pow(col, vec3(0.85));
  o = vec4(col, 1.0);
}`;

const progEsc  = link(VS_FS_TRI, FS_ESCAPE);
const progPt   = link(VS_POINT,  FS_POINT);
const progTone = link(VS_FS_TRI, FS_TONE);
const UE = locations(progEsc,  ['u_res','u_center','u_scale','u_type','u_maxIter','u_julia','u_palA','u_palB','u_palC','u_palD']);
const UP = locations(progPt,   ['u_res','u_scale','u_gain','u_palA','u_palB','u_palC','u_palD']);
const UT = locations(progTone, ['u_acc','u_exposure']);

// fullscreen triangle
const fsVAO = gl.createVertexArray();
gl.bindVertexArray(fsVAO);
const fsBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// streaming point buffer
const MAX_PTS = 1 << 16;                       // 65536 — one fern batch (2048 chains x 32 steps)
const ptData = new Float32Array(MAX_PTS * 3);
const ptVAO = gl.createVertexArray();
gl.bindVertexArray(ptVAO);
const ptBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
gl.bufferData(gl.ARRAY_BUFFER, ptData.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
gl.bindVertexArray(null);

// accumulation FBO
let accTex = null, accFBO = null;
function ensureAccum(w, h){
  if (accTex) { gl.deleteTexture(accTex); gl.deleteFramebuffer(accFBO); }
  accTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, accTex);
  if (extFloat)
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  else
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  accFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, accFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, accTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
const SPLAT_GAIN = extFloat ? 1.0 : (1.0 / 24.0);

// ================= Fractal catalog =================
// kinds: 'escape' renders in the fragment shader, 'density' via chaos-game splatting
const TYPES = [
  { name: 'Mandelbrot',     kind: 'escape',  esc: 0,                  home: { cx: -0.6, cy: 0,    ext: 1.7  } },
  { name: 'Burning Ship',   kind: 'escape',  esc: 1,                  home: { cx: -0.5, cy: -0.4, ext: 1.7  } },
  { name: 'Phoenix',        kind: 'escape',  esc: 2,                  home: { cx: 0,    cy: 0,    ext: 1.25 } },
  { name: 'Barnsley Fern',  kind: 'density', sub: 'fern', expK: 0.10, home: { cx: 0.25, cy: 5.0,  ext: 5.3  } },
  { name: 'Koch Snowflake', kind: 'escape',  esc: 3,                  home: { cx: 0,    cy: 0,    ext: 0.75 } },
  { name: 'Julia',          kind: 'escape',  esc: 4,                  home: { cx: 0,    cy: 0,    ext: 1.6  } },
];

const JULIA_CS = [
  [-0.7269,  0.1889], [ 0.285,  0.01  ], [-0.8,    0.156 ], [-0.4,   0.6  ],
  [-0.835,  -0.2321], [ 0.37,  -0.1   ], [-0.7,    0.27015], [-0.1,   0.651],
];

// palettes: a + b*cos(2pi(c*t + d))
const PRESETS = [
  [[0.5,0.5,0.5],[0.5,0.5,0.5],[1.0,1.0,1.0],[0.00,0.33,0.67]],
  [[0.5,0.5,0.5],[0.5,0.5,0.5],[1.0,1.0,1.0],[0.00,0.10,0.20]],
  [[0.5,0.5,0.5],[0.5,0.5,0.5],[1.0,1.0,0.5],[0.80,0.90,0.30]],
  [[0.5,0.5,0.5],[0.5,0.5,0.5],[1.0,0.7,0.4],[0.00,0.15,0.20]],
  [[0.5,0.5,0.5],[0.5,0.5,0.5],[2.0,1.0,0.0],[0.50,0.20,0.25]],
  [[0.8,0.5,0.4],[0.2,0.4,0.2],[2.0,1.0,1.0],[0.00,0.25,0.25]],
];
function randomPalette(){
  if (Math.random() < 0.5){
    const p = PRESETS[Math.floor(Math.random() * PRESETS.length)];
    return p.map(v => v.slice());
  }
  const r = (a, b) => a + Math.random() * (b - a);
  return [
    [r(0.35,0.6), r(0.35,0.6), r(0.35,0.6)],
    [r(0.25,0.5), r(0.25,0.5), r(0.25,0.5)],
    [r(0.5,2.0),  r(0.5,1.5),  r(0.5,1.5)],
    [r(0,1),      r(0,1),      r(0,1)],
  ];
}

function iterForZoom(zoom){
  return Math.min(700, Math.floor(80 + 45 * Math.log2(zoom + 2)));
}
function kochIterForZoom(zoom){
  return Math.min(30, 6 + Math.ceil(Math.log(zoom + 1) / Math.log(3)));
}

// ================= Chaos-game state (CPU fp64) =================
// Barnsley fern IFS: [a,b,c,d,e,f, probability, palette coord]
const FERN = [
  [ 0.00,  0.00,  0.00, 0.16, 0.0, 0.00, 0.01, 0.15],
  [ 0.85,  0.04, -0.04, 0.85, 0.0, 1.60, 0.85, 0.45],
  [ 0.20, -0.26,  0.23, 0.22, 0.0, 1.60, 0.07, 0.70],
  [-0.15,  0.28,  0.26, 0.24, 0.0, 0.44, 0.07, 0.90],
];

const N_CHAINS = 2048, CHAIN_STEPS = 32;
const chainX = new Float64Array(N_CHAINS);
const chainY = new Float64Array(N_CHAINS);

function fernStep(i){
  const r = Math.random();
  let acc = 0, f = FERN[0];
  for (const row of FERN){ acc += row[6]; if (r <= acc){ f = row; break; } }
  const x = chainX[i], y = chainY[i];
  chainX[i] = f[0]*x + f[1]*y + f[4];
  chainY[i] = f[2]*x + f[3]*y + f[5];
  return f[7];
}
function initChains(){
  chainX.fill(0);
  chainY.fill(0);
  for (let k = 0; k < 30; k++)                 // burn-in
    for (let i = 0; i < N_CHAINS; i++) fernStep(i);
}

// ================= View state =================
const MAX_ZOOM  = 25000;
const MIN_ZOOM  = 0.4;
const ZOOM_RATE = 0.9;     // e^rate per second while holding
const CYCLE_RATE = 0.30;   // palette phase per second while Cycle is held

const S = {
  type: 0,
  pal: randomPalette(),
  palShift: 0,
  zoom: 1,
  center: { x: 0, y: 0 },
  julia: JULIA_CS[0],
  dirty: true,            // accumulation must restart
  frames: 0,
  inView: 0,
};

const nameEl = document.getElementById('fname');
const zoomEl = document.getElementById('fzoom');

function fmtC(c){
  const s = (v) => (v < 0 ? '\u2212' : '+') + Math.abs(v).toFixed(3);
  return `c = ${s(c[0]).replace('+','')}${s(c[1])}i`;
}
function updateHudName(){
  const t = TYPES[S.type];
  nameEl.textContent = t.esc === 4 ? `${t.name}  ${fmtC(S.julia)}` : t.name;
}
function goHome(){
  const h = TYPES[S.type].home;
  S.zoom = 1;
  S.center.x = h.cx;
  S.center.y = h.cy;
  S.dirty = true;
}
function selectType(idx){
  S.type = idx;
  const t = TYPES[idx];
  if (t.esc === 4)      S.julia = JULIA_CS[Math.floor(Math.random() * JULIA_CS.length)];
  if (t.sub === 'fern') initChains();
  goHome();
  updateHudName();
}
selectType(0);

// ================= Interaction =================
const pointer = { uv: { x: 0, y: 0 }, holding: false };

function setPointer(e){
  const dpr = canvas.width / canvas.clientWidth;
  const x = e.clientX * dpr, y = e.clientY * dpr;
  pointer.uv.x = (x - 0.5 * canvas.width)  / canvas.height;
  pointer.uv.y = (0.5 * canvas.height - y) / canvas.height;
}
function zoomAt(uv, f){
  const ext = TYPES[S.type].home.ext;
  const oldZoom = S.zoom;
  S.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, S.zoom * f));
  const s0 = ext / oldZoom, s1 = ext / S.zoom;
  S.center.x += uv.x * 2 * (s0 - s1);
  S.center.y += uv.y * 2 * (s0 - s1);
  S.dirty = true;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  setPointer(e);
  pointer.holding = true;
});
canvas.addEventListener('pointermove', e => { if (pointer.holding) setPointer(e); });
canvas.addEventListener('pointerup',     () => { pointer.holding = false; });
canvas.addEventListener('pointercancel', () => { pointer.holding = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  setPointer(e);
  zoomAt(pointer.uv, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

document.getElementById('bFractal').addEventListener('click', () => {
  selectType((S.type + 1) % TYPES.length);
});
let cycling = false;
const bCycle = document.getElementById('bCycle');
bCycle.addEventListener('pointerdown', e => {
  e.preventDefault();
  bCycle.setPointerCapture(e.pointerId);
  cycling = true;
});
bCycle.addEventListener('pointerup',     () => { cycling = false; });
bCycle.addEventListener('pointercancel', () => { cycling = false; });
document.getElementById('bReset').addEventListener('click', goHome);
function isEffectivelyFullscreen() {
  return !!document.fullscreenElement
    || matchMedia('(display-mode: fullscreen)').matches
    || (innerWidth === screen.width && innerHeight === screen.height);
}

function canRequestFullscreen() {
  return document.fullscreenEnabled && !isEffectivelyFullscreen();
}

const bFull = document.getElementById('bFull');
function updateFullscreenLabel() {
  bFull.textContent = isEffectivelyFullscreen() ? 'Exit Fullscreen' : 'Enter Fullscreen';
}
updateFullscreenLabel();
bFull.addEventListener('click', async () => {
  if (isEffectivelyFullscreen()) {
    await document.exitFullscreen();
  } else if (canRequestFullscreen()) {
    await document.documentElement.requestFullscreen();
  }
  updateFullscreenLabel();
});
document.addEventListener('fullscreenchange', updateFullscreenLabel);
window.addEventListener('resize', updateFullscreenLabel);

// ================= Resize =================
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    ensureAccum(w, h);
    S.dirty = true;
  }
}

// ================= Point generation (relative to view center, fp64) =================
// returns [pointCount, inViewCount]
function generatePoints(){
  const t = TYPES[S.type];
  const s = t.home.ext / S.zoom;
  const halfH = s;
  const halfW = s * canvas.width / canvas.height;
  const cx = S.center.x, cy = S.center.y;
  const wX = halfW * 1.05, wY = halfH * 1.05;
  let w = 0, inView = 0;

  const put = (relX, relY, tc) => {
    if (relX > -wX && relX < wX && relY > -wY && relY < wY){
      ptData[w++] = relX; ptData[w++] = relY; ptData[w++] = tc;
      if (relX > -halfW && relX < halfW && relY > -halfH && relY < halfH) inView++;
    }
  };

  // fern chaos game (the only density fractal left)
  for (let k = 0; k < CHAIN_STEPS; k++){
    for (let i = 0; i < N_CHAINS; i++){
      const tc = fernStep(i);
      put(chainX[i] - cx, chainY[i] - cy, tc);
      if (w >= ptData.length - 3) return [w / 3, inView];
    }
  }
  return [w / 3, inView];
}

// ================= Main loop =================
let last = performance.now();

function uploadPalette(U){
  const d = S.pal[3];
  gl.uniform3fv(U.u_palA, S.pal[0]);
  gl.uniform3fv(U.u_palB, S.pal[1]);
  gl.uniform3fv(U.u_palC, S.pal[2]);
  gl.uniform3f(U.u_palD, d[0] + S.palShift, d[1] + S.palShift, d[2] + S.palShift);
}

function frame(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (pointer.holding) zoomAt(pointer.uv, Math.exp(ZOOM_RATE * dt));
  if (cycling){ S.palShift += CYCLE_RATE * dt; S.dirty = true; }

  resize();
  const t = TYPES[S.type];
  const scale = t.home.ext / S.zoom;

  if (t.kind === 'escape'){
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(progEsc);
    gl.bindVertexArray(fsVAO);
    gl.uniform2f(UE.u_res, canvas.width, canvas.height);
    gl.uniform2f(UE.u_center, S.center.x, S.center.y);
    gl.uniform1f(UE.u_scale, scale);
    gl.uniform1i(UE.u_type, t.esc);
    gl.uniform1i(UE.u_maxIter, t.esc === 3 ? kochIterForZoom(S.zoom) : iterForZoom(S.zoom));
    gl.uniform2f(UE.u_julia, S.julia[0], S.julia[1]);
    uploadPalette(UE);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else {
    // --- accumulate ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, accFBO);
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (S.dirty){
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      S.frames = 0;
      S.inView = 0;
      S.dirty = false;
    }
    const [count, inView] = generatePoints();
    S.frames++;
    S.inView += inView;
    if (count > 0){
      gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, ptData.subarray(0, count * 3));
      gl.useProgram(progPt);
      gl.bindVertexArray(ptVAO);
      gl.uniform2f(UP.u_res, canvas.width, canvas.height);
      gl.uniform1f(UP.u_scale, scale);
      gl.uniform1f(UP.u_gain, SPLAT_GAIN);
      uploadPalette(UP);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.drawArrays(gl.POINTS, 0, count);
      gl.disable(gl.BLEND);
    }
    // --- tonemap ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(progTone);
    gl.bindVertexArray(fsVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, accTex);
    gl.uniform1i(UT.u_acc, 0);
    const pixels = canvas.width * canvas.height;
    let exposure = t.expK * pixels / Math.max(S.inView, 1) / SPLAT_GAIN;
    exposure = Math.min(exposure, 500 / SPLAT_GAIN);
    gl.uniform1f(UT.u_exposure, exposure);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  zoomEl.textContent = S.zoom < 1000
    ? S.zoom.toFixed(1)
    : S.zoom.toExponential(1).replace('+', '');

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
