<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - instancing - dynamic</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - instancing - dynamic">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_instancing_dynamic.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_instancing_dynamic.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - instancing - dynamic<br/>
			Based on <a href="https://oosmoxiecode.com/archive/js_webgl/cubescape/" target="_blank" rel="noopener">Cubescape</a>
			by <a href="https://github.com/oosmoxiecode" target="_blank" rel="noopener">oosmoxiecode</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import TWEEN from 'three/addons/libs/tween.module.js';

			let camera, scene, renderer, timer, mesh;

			const amount = 14;

			const count = Math.pow( amount, 2 );
			const dummy = new THREE.Object3D();

			const seeds = [];
			const baseColors = [];

			const color = new THREE.Color();
			const colors = [ new THREE.Color( 0x00ffff ), new THREE.Color( 0xffff00 ), new THREE.Color( 0xff00ff ) ];
			const animation = { t: 0 };
			let currentColorIndex = 0;
			let nextColorIndex = 1;

			const maxDistance = 75;
			const cameraTarget = new THREE.Vector3();

			init();

			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 10, 10, 10 );
				camera.lookAt( 0, 0, 0 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xadd8e6 );

				scene.add( new THREE.AmbientLight( 0xffffff, 0.6 ) );
				const dirLight = new THREE.DirectionalLight( 0xffffff, 1.2 );
				dirLight.position.set( 5, 10, 7 );
				scene.add( dirLight );

				timer = new THREE.Timer();
				timer.connect( document );

				const loader = new THREE.TextureLoader();
				const texture = loader.load( 'textures/edge3.jpg' );
				texture.colorSpace = THREE.SRGBColorSpace;

				const geometry = new THREE.BoxGeometry();
				const material = new THREE.MeshStandardMaterial( { map: texture } );

				mesh = new THREE.InstancedMesh( geometry, material, count );
				mesh.instanceMatrix.setUsage( THREE.DynamicDrawUsage ); // will be updated every frame
				scene.add( mesh );

				// [DIAG] hook bufferData / bufferSubData to see what payload three
				// actually uploads to the instance-matrix buffer, and log the first
				// few sampled entries so we can tell if the whole buffer or just the
				// first matrix made it. Also hook drawElementsInstanced (as before).
				const _diagGL = renderer.getContext();
				const _origBD  = _diagGL.bufferData.bind( _diagGL );
				const _origBSD = _diagGL.bufferSubData.bind( _diagGL );
				const _origDEI = _diagGL.drawElementsInstanced.bind( _diagGL );
				const _origVAP = _diagGL.vertexAttribPointer.bind( _diagGL );
				const _origVAD = _diagGL.vertexAttribDivisor.bind( _diagGL );
				// Buffer identity: give each Buffer an id via a Map keyed by object.
				const _bufIds = new WeakMap();
				let _bufIdN = 0;
				function _idOf( b ) {
					if ( ! b ) return '(null)';
					if ( ! _bufIds.has( b ) ) _bufIds.set( b, ++ _bufIdN );
					return 'B' + _bufIds.get( b );
				}
				const _origBB = _diagGL.bindBuffer.bind( _diagGL );
				_diagGL.bindBuffer = function ( target, buf ) {
					if ( target === _diagGL.ARRAY_BUFFER || target === _diagGL.ELEMENT_ARRAY_BUFFER ) {
						console.log( '[DIAG-BB] tgt=' + target + ' buf=' + _idOf( buf ) );
					}
					return _origBB( target, buf );
				};
				_diagGL.vertexAttribPointer = function ( idx, size, type, norm, stride, offset ) {
					const buf = _diagGL.getParameter( _diagGL.ARRAY_BUFFER_BINDING );
					console.log( '[DIAG-VAP] idx=' + idx + ' size=' + size + ' stride=' + stride + ' off=' + offset + ' buf=' + _idOf( buf ) );
					return _origVAP( idx, size, type, norm, stride, offset );
				};
				const _origBVA = _diagGL.bindVertexArray.bind( _diagGL );
				_diagGL.bindVertexArray = function ( vao ) {
					console.log( '[DIAG-BVA] vao=' + _idOf( vao ) );
					return _origBVA( vao );
				};
				_diagGL.vertexAttribDivisor = function ( idx, divisor ) {
					console.log( '[DIAG-VAD] idx=' + idx + ' div=' + divisor );
					return _origVAD( idx, divisor );
				};
				let _diagBDCount = 0, _diagBSDCount = 0;
				function _summarize( data ) {
					if ( ! data ) return '(nil)';
					if ( typeof data === 'number' ) return 'size=' + data;
					const byteLen = data.byteLength !== undefined ? data.byteLength : ( data.length * ( data.BYTES_PER_ELEMENT || 1 ) );
					let sample = '';
					if ( data.buffer !== undefined ) {
						const f = new Float32Array( data.buffer, data.byteOffset || 0, Math.min( 20, ( byteLen / 4 ) | 0 ) );
						sample = ' f32=[' + Array.from( f ).map( v => v.toFixed( 2 ) ).join( ',' ) + ']';
					}
					return 'bytes=' + byteLen + sample;
				}
				_diagGL.bufferData = function ( target, data, usage, srcOffset, length ) {
					if ( _diagBDCount < 8 ) {
						console.log( '[DIAG-BD] tgt=' + target + ' usage=' + usage + ' ' + _summarize( data ) );
					}
					_diagBDCount ++;
					return _origBD( target, data, usage, srcOffset, length );
				};
				_diagGL.bufferSubData = function ( target, offset, data, srcOffset, length ) {
					if ( _diagBSDCount < 8 ) {
						console.log( '[DIAG-BSD] tgt=' + target + ' off=' + offset + ' ' + _summarize( data ) );
					}
					_diagBSDCount ++;
					return _origBSD( target, offset, data, srcOffset, length );
				};
				let _diagLoggedFrames = 0;
				_diagGL.drawElementsInstanced = function ( mode, cnt, type, offset, instanceCount ) {
					// [EXPERIMENT] Force-re-emit divisors on the 5 per-instance
					// slots (mat4 rows 0-3 + instanceColor 4) immediately before
					// the draw. If the "1 cube" symptom disappears, some layer
					// below Three.js's cache is losing per-VAO divisor state.
					_origVAD( 0, 1 );
					_origVAD( 1, 1 );
					_origVAD( 2, 1 );
					_origVAD( 3, 1 );
					_origVAD( 4, 1 );
					if ( _diagLoggedFrames < 2 ) {
						console.log( '[DIAG-DEI] mode=' + mode + ' cnt=' + cnt + ' inst=' + instanceCount + ' (forced-divs)' );
					}
					_diagLoggedFrames ++;
					return _origDEI( mode, cnt, type, offset, instanceCount );
				};

				let i = 0;
				const offset = ( amount - 1 ) / 2;

				for ( let x = 0; x < amount; x ++ ) {

					for ( let z = 0; z < amount; z ++ ) {

						dummy.position.set( offset - x, 0, offset - z );
						dummy.scale.set( 1, 2, 1 );

						dummy.updateMatrix();

						color.setHSL( 1, 0.5 + ( Math.random() * 0.5 ), 0.5 + ( Math.random() * 0.5 ) );
						baseColors.push( color.getHex() );

						mesh.setMatrixAt( i, dummy.matrix );
						mesh.setColorAt( i, color.multiply( colors[ 0 ] ) );

						i ++;

						seeds.push( Math.random() );

					}

				}

				//

				window.addEventListener( 'resize', onWindowResize );

				setInterval( startTween, 3000 );

			}

			function startTween() {

				// tween for animating color transition
			
				new TWEEN.Tween( animation )
					.to( {
						t: 1
					}, 2000 )
					.easing( TWEEN.Easing.Sinusoidal.In )
					.onComplete( () => {

						animation.t = 0;

						currentColorIndex = nextColorIndex;
						nextColorIndex ++;

						if ( nextColorIndex >= colors.length ) nextColorIndex = 0;

					} )
					.start();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				timer.update();

				const time = timer.getElapsed();

				TWEEN.update();

				// animate camera

				camera.position.x = Math.sin( time / 4 ) * 10;
				camera.position.z = Math.cos( time / 4 ) * 10;
				camera.position.y = 8 + Math.cos( time / 2 ) * 2;

				cameraTarget.x = Math.sin( time / 4 ) * - 8;
				cameraTarget.z = Math.cos( time / 2 ) * - 8;

				camera.lookAt( cameraTarget );

				camera.up.x = Math.sin( time / 400 );

				// animate instance positions and colors

				for ( let i = 0; i < mesh.count; i ++ ) {

					mesh.getMatrixAt( i, dummy.matrix );
					dummy.matrix.decompose( dummy.position, dummy.quaternion, dummy.scale );

					dummy.position.y = Math.abs( Math.sin( ( time + seeds[ i ] ) * 2 + seeds[ i ] ) );

					dummy.updateMatrix();

					mesh.setMatrixAt( i, dummy.matrix );

					// colors

					if ( animation.t > 0 ) {

						const currentColor = colors[ currentColorIndex ];
						const nextColor = colors[ nextColorIndex ];
			
						const f = dummy.position.length() / maxDistance;

						if ( f <= animation.t ) {

							color.set( baseColors[ i ] ).multiply( nextColor );

						} else {

							color.set( baseColors[ i ] ).multiply( currentColor );

						}

						mesh.setColorAt( i, color );

					}

				}

				mesh.instanceMatrix.needsUpdate = true;
				if ( animation.t > 0 ) mesh.instanceColor.needsUpdate = true;

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
