<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>2D Platformer Microgame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* Self-contained (no TemplateData/style.css — its bar/logo are CSS url()
         images that 404 under Brewser). Fullscreen 1280x720. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                   background: #231F20; overflow: hidden; font-family: sans-serif; }
      #unity-container { position: absolute; inset: 0; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #231F20; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; color: #d0d0d0; gap: 18px; }
      #loading-title { font-size: 22px; }
      #loading-pct { font-size: 15px; color: #9a9a9a; }
      #loading-track { width: 460px; max-width: 60%; height: 12px; border-radius: 6px;
                       background: rgba(255,255,255,0.14); overflow: hidden; }
      #loading-fill { width: 0%; height: 100%; border-radius: 6px; background: #5aa9ff;
                      transition: width 0.1s linear; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
                       color: #fff; font-size: 14px; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-title">2D Platformer Microgame</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
        <div id="loading-pct">Loading&hellip; 0%</div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingPct = document.querySelector("#loading-pct");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        if (type == 'error') div.style = 'background:#b00;padding:8px 12px;border-radius:4px;';
        else if (type == 'warning') div.style = 'background:#b8860b;padding:8px 12px;border-radius:4px;';
        warningBanner.appendChild(div);
        if (type != 'error') setTimeout(function(){ if (div.parentNode) div.parentNode.removeChild(div); }, 5000);
      }

      // Build files are shipped UNCOMPRESSED (no .gz) so Brewser's local fetch
      // serves them directly. Unity's mobile-device block is removed (nx.js UA
      // can trip the Android check); devicePixelRatio pinned to 1 for Tegra.
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/custom_apps.loader.js";
      var config = {
        dataUrl: buildUrl + "/custom_apps.data",
        frameworkUrl: buildUrl + "/custom_apps.framework.js",
        codeUrl: buildUrl + "/custom_apps.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "2D Platformer Microgame",
        productVersion: "4.0.1",
        showBanner: unityShowBanner,
        devicePixelRatio: 1,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var p = Math.round(100 * progress);
          loadingFill.style.width = p + "%";
          loadingPct.textContent = p < 100 ? ("Loading… " + p + "%")
                                           : "Starting engine… (first launch is slow)";
        }).then((unityInstance) => {
          loading.style.display = "none";
        }).catch((message) => {
          loadingPct.textContent = "Failed to load.";
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
