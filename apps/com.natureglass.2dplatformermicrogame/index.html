<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>2D Platformer Microgame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Brewser/Switch: fill the 1280x720 display. The stock Unity template
         pins #unity-container to a fixed 960x600 desktop window; override it
         so the canvas is the whole viewport (manifest fullscreen: true). */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
        overflow: hidden;
      }
      #unity-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      /* Center the loading bar over the fullscreen canvas. */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">2D Platformer Microgame</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or a
      // permanent error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Build files are shipped DECOMPRESSED (the source .data.gz/.wasm.gz/
      // .framework.js.gz were gunzipped and the .gz suffix dropped). Brewser's
      // local scheme fetch serves raw bytes without a "Content-Encoding: gzip"
      // header and does not transparently gunzip, so a .gz build would fail;
      // Unity's loader only attempts decompression when the URL ends in .gz/.br.
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/platformer.loader.js";
      var config = {
        dataUrl: buildUrl + "/platformer.data",
        frameworkUrl: buildUrl + "/platformer.framework.js",
        codeUrl: buildUrl + "/platformer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "2D Platformer Microgame",
        productVersion: "4.0.1",
        showBanner: unityShowBanner,
        // Pin to 1: on Tegra a 2x render target (2560x1440) is wasteful and
        // the display is 1280x720.
        devicePixelRatio: 1,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
