<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gravity Balls — WebGL2</title>
<style>
  /* Flat rendering only: solid fills + solid borders. No gradients, shadows, blur. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #101418;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bar {
    position: fixed; top: 12px; left: 12px;
    display: flex; gap: 6px; flex-wrap: wrap;
    z-index: 5;
  }
  #bar button {
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    color: #d8d8d8;
    background: #0a0a0a;
    border: 1px solid #3a3a3a;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  #bar button:hover  { background: #1a1a1a; }
  #bar button:active { background: #2a2a2a; border-color: #6a6a6a; }
  #hud {
    position: fixed; left: 12px; bottom: 12px;
    color: #8a93a0; font-size: 11px; letter-spacing: .08em;
    pointer-events: none;
  }
  #hud b { color: #e8edf2; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="bFull">Full screen</button>
</div>
<div id="hud"><b>GRAVITY BALLS</b> · <span id="st">BOOT</span></div>

<script>
"use strict";

/* ============================== GL setup ============================== */

const canvas = document.getElementById('c');
const stEl = document.getElementById('st');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false
});
if (!gl) {
  stEl.textContent = 'WEBGL2 UNAVAILABLE';
  throw new Error('webgl2 unavailable');
}

// DPR capped at 2 — crisp on 3x panels without paying the fill cost.
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const D2R = Math.PI / 180;

const VS = `#version 300 es
layout(location=0) in vec2 aCorner;   // unit quad corner in [-1,1]
layout(location=1) in vec2 aCenter;   // device px
layout(location=2) in float aRadius;  // device px
layout(location=3) in vec3 aColor;
uniform vec2 uRes;
out vec2 vLocal;
out vec3 vColor;
void main() {
  vLocal = aCorner;
  vColor = aColor;
  vec2 p = aCenter + aCorner * aRadius;
  vec2 clip = p / uRes * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
}`;

// Flat fill; the only alpha ramp is a ~1px fwidth edge for anti-aliasing
// (premultiplied output). No glow, no gradient.
const FS = `#version 300 es
precision mediump float;
in vec2 vLocal;
in vec3 vColor;
out vec4 o;
void main() {
  float r = length(vLocal);
  float aa = fwidth(r);
  float a = 1.0 - smoothstep(1.0 - aa, 1.0, r);
  if (a <= 0.0) discard;
  o = vec4(vColor * a, a);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const uRes = gl.getUniformLocation(prog, 'uRes');

const N = 20;
const FLOATS_PER = 6;                 // cx, cy, r, cr, cg, cb
const inst = new Float32Array(N * FLOATS_PER);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// Per-vertex unit quad (TRIANGLE_STRIP).
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// Per-instance interleaved stream, rewritten every frame.
const instBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
const STRIDE = FLOATS_PER * 4;
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 2, gl.FLOAT, false, STRIDE, 0);
gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2, 1, gl.FLOAT, false, STRIDE, 8);
gl.vertexAttribDivisor(2, 1);
gl.enableVertexAttribArray(3);
gl.vertexAttribPointer(3, 3, gl.FLOAT, false, STRIDE, 12);
gl.vertexAttribDivisor(3, 1);

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied
gl.clearColor(0x10/255, 0x14/255, 0x18/255, 1);

/* ============================== physics =============================== */

const PALETTE = [
  '#ff5252', '#ff9f43', '#feca57', '#2ed573', '#1dd1a1',
  '#48dbfb', '#54a0ff', '#a29bfe', '#c56cf0', '#ff6b81'
].map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255));

let W = 0, H = 0, MIN = 0;
const balls = [];

function initBalls() {
  balls.length = 0;
  for (let i = 0; i < N; i++) {
    const r = MIN * (0.022 + Math.random() * 0.033);   // variable sizes
    balls.push({
      x: r + Math.random() * (W - 2 * r),
      y: r + Math.random() * Math.max(1, H * 0.6 - 2 * r),
      vx: (Math.random() - 0.5) * MIN * 0.3,
      vy: (Math.random() - 0.5) * MIN * 0.3,
      r,
      invM: 1 / (r * r),                               // mass ∝ area
      c: PALETTE[(Math.random() * PALETTE.length) | 0]
    });
  }
}

function resize() {
  W = Math.max(1, Math.round(innerWidth * DPR));
  H = Math.max(1, Math.round(innerHeight * DPR));
  MIN = Math.min(W, H);
  canvas.width = W;
  canvas.height = H;
  gl.viewport(0, 0, W, H);
  gl.uniform2f(uRes, W, H);
  if (!balls.length) initBalls();
  for (const b of balls) {              // keep everything inside on rotate/resize
    b.x = Math.min(Math.max(b.x, b.r), W - b.r);
    b.y = Math.min(Math.max(b.y, b.r), H - b.r);
  }
}
addEventListener('resize', resize);
resize();

/* Gravity direction (unit-ish vector in screen px coords, y down).
 * Magnitude scales with |g| projected into the screen plane, so a
 * screen-flat device correctly yields near-zero in-plane gravity. */
let gx = 0, gy = 1;
let sensorLive = false;
let lastSensorMs = 0;

function onOrient(e) {
  // Desktop Chrome fires one all-null event — treat as no IMU.
  if (e.beta == null || e.gamma == null) return;
  // While the user is actively dragging, the pointer owns gravity.
  // Skip the IMU update so it doesn't fight the drag at the pump rate.
  if (dragging) { sensorLive = true; lastSensorMs = performance.now(); return; }
  const b = e.beta * D2R, g = e.gamma * D2R;

  // Earth gravity in device pixel coords (x right, y down), derived from
  // the intrinsic Z-X'-Y'' rotation: gx = sinγ·cosβ, gy = sinβ.
  // The cosβ factor is what keeps gamma's sign flip past β=90° coherent.
  const dx = Math.sin(g) * Math.cos(b);
  const dy = Math.sin(b);

  // Remap device → screen for the current screen rotation. If landscape
  // tracking feels mirrored on a given device, flip the sign of `s`.
  const angDeg = (screen.orientation && screen.orientation.angle != null)
    ? screen.orientation.angle
    : (typeof window.orientation === 'number' ? window.orientation : 0);
  const ang = angDeg * D2R;
  const c = Math.cos(ang), s = Math.sin(ang);
  gx = dx * c + dy * s;
  gy = dy * c - dx * s;

  sensorLive = true;
  lastSensorMs = performance.now();
}

// Drag on the canvas to point gravity — always available, IMU-live or
// not. When a drag is active the `onOrient` handler above skips its
// update so the two sources don't fight at 30 Hz.
let dragging = false;
function pointerTilt(e) {
  const px = e.clientX * DPR - W / 2;
  const py = e.clientY * DPR - H / 2;
  const l = Math.hypot(px, py);
  if (l > 1) { gx = px / l; gy = py / l; }
}
canvas.addEventListener('pointerdown', e => { dragging = true; pointerTilt(e); });
canvas.addEventListener('pointermove', e => { if (dragging) pointerTilt(e); });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

// Hook the sensor immediately — matches sensorstest's pattern. The Switch
// runtime's DeviceOrientationEvent polyfill auto-grants permission (no
// user gesture required); on mobile Safari with real iOS 13+ permission
// gating, this listener silently no-ops until permission is granted
// elsewhere, and the pointer-drag fallback above covers that case.
//
// Note: `window.addEventListener` (explicit receiver), NOT bare
// `addEventListener()` — under `"use strict"` a bare call passes
// `this === undefined` to the runtime's LiveWindow.prototype.addEventListener
// wrap, which then fails to register the underlying listener on the
// LiveWindow. `window.addEventListener(...)` sets `this === window` and
// works correctly.
window.addEventListener('deviceorientation', onOrient);

/* Impulse + positional-correction solver. 20 balls → 190 pairs; at
 * 5 substeps × 8 iterations this is still trivially cheap, and the
 * iteration budget is what makes the stacks settle instead of jitter. */
const SUBSTEPS = 5;
const ITER = 8;
const REST = 0.22;          // ball-ball restitution (low → stable stacking)
const WREST = 0.30;         // wall restitution
const MU = 0.05;            // Coulomb friction vs. normal impulse
const WFR = 0.02;           // wall tangential drag per contact pass
const PCT = 0.85;           // Baumgarte positional-correction factor
const DAMP = 0.12;          // global linear damping /s

function step(h) {
  const G = MIN * 2.2;                        // gravity magnitude, px/s²
  const ax = gx * G, ay = gy * G;
  const damp = Math.max(0, 1 - DAMP * h);
  const maxV = MIN * 3;
  const SLOP = 0.4 * DPR;

  for (const b of balls) {
    b.vx = (b.vx + ax * h) * damp;
    b.vy = (b.vy + ay * h) * damp;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > maxV) { const k = maxV / sp; b.vx *= k; b.vy *= k; }
    b.x += b.vx * h;
    b.y += b.vy * h;
  }

  for (let it = 0; it < ITER; it++) {
    // Walls
    for (const b of balls) {
      if (b.x < b.r)           { b.x = b.r;     if (b.vx < 0) b.vx = -b.vx * WREST; b.vy *= 1 - WFR; }
      else if (b.x > W - b.r)  { b.x = W - b.r; if (b.vx > 0) b.vx = -b.vx * WREST; b.vy *= 1 - WFR; }
      if (b.y < b.r)           { b.y = b.r;     if (b.vy < 0) b.vy = -b.vy * WREST; b.vx *= 1 - WFR; }
      else if (b.y > H - b.r)  { b.y = H - b.r; if (b.vy > 0) b.vy = -b.vy * WREST; b.vx *= 1 - WFR; }
    }
    // Pairs
    for (let i = 0; i < N; i++) {
      const A = balls[i];
      for (let j = i + 1; j < N; j++) {
        const B = balls[j];
        let nx = B.x - A.x, ny = B.y - A.y;
        const rr = A.r + B.r;
        const d2 = nx * nx + ny * ny;
        if (d2 >= rr * rr) continue;
        let d = Math.sqrt(d2);
        if (d < 1e-6) { d = 1e-6; nx = 1; ny = 0; }
        else { nx /= d; ny /= d; }
        const invSum = A.invM + B.invM;

        // Positional correction (with slop) — de-penetrate by inverse mass.
        const corr = Math.max(rr - d - SLOP, 0) / invSum * PCT;
        A.x -= nx * corr * A.invM; A.y -= ny * corr * A.invM;
        B.x += nx * corr * B.invM; B.y += ny * corr * B.invM;

        // Normal impulse, only if approaching.
        const rvx = B.vx - A.vx, rvy = B.vy - A.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jn = -(1 + REST) * vn / invSum;
          A.vx -= nx * jn * A.invM; A.vy -= ny * jn * A.invM;
          B.vx += nx * jn * B.invM; B.vy += ny * jn * B.invM;

          // Coulomb-clamped tangential friction — helps stacks stop creeping.
          const tvx = rvx - vn * nx, tvy = rvy - vn * ny;
          const tl = Math.hypot(tvx, tvy);
          if (tl > 1e-4) {
            const tx = tvx / tl, ty = tvy / tl;
            let jt = -tl / invSum;
            const maxF = MU * Math.abs(jn);
            if (jt < -maxF) jt = -maxF;
            A.vx -= tx * jt * A.invM; A.vy -= ty * jt * A.invM;
            B.vx += tx * jt * B.invM; B.vy += ty * jt * B.invM;
          }
        }
      }
    }
  }
}

/* =============================== loop ================================ */

function draw() {
  for (let i = 0; i < N; i++) {
    const b = balls[i], o = i * FLOATS_PER;
    inst[o]     = b.x;
    inst[o + 1] = b.y;
    inst[o + 2] = b.r;
    inst[o + 3] = b.c[0];
    inst[o + 4] = b.c[1];
    inst[o + 5] = b.c[2];
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
}

/* ============================== HUD ============================== */

function isEffectivelyFullscreen() {
  return !!document.fullscreenElement
    || matchMedia('(display-mode: fullscreen)').matches
    || (innerWidth === screen.width && innerHeight === screen.height);
}

function canRequestFullscreen() {
  return document.fullscreenEnabled && !isEffectivelyFullscreen();
}

const bFull = document.getElementById('bFull');
function updateFullscreenLabel() {
  bFull.textContent = isEffectivelyFullscreen() ? 'Exit Fullscreen' : 'Enter Fullscreen';
}
updateFullscreenLabel();
bFull.addEventListener('click', async () => {
  // Gate on `isEffectivelyFullscreen()`, not `document.fullscreenElement`
  // — under a manifest-declared launch fullscreen (Switch's
  // `fullscreen-app` shell mode) there's no `fullscreenElement` to
  // check, but `document.exitFullscreen()` still routes through the
  // shell's exit path via the runtime polyfill.
  if (isEffectivelyFullscreen()) {
    await document.exitFullscreen();
  } else if (canRequestFullscreen()) {
    await document.documentElement.requestFullscreen();
  }
  // Belt-and-suspenders: `fullscreenchange` doesn't fire for the
  // shell-mode exit path (there's no `fullscreenElement` transition),
  // and `resize` may or may not fire depending on how the runtime
  // pushes the new CSS viewport. Re-derive the label from the current
  // effective state after the exit/enter resolves.
  updateFullscreenLabel();
});
document.addEventListener('fullscreenchange', updateFullscreenLabel);
window.addEventListener('resize', updateFullscreenLabel);

let lastT = performance.now();
let hudTick = 0;
function frame(t) {
  const dt = Math.min((t - lastT) / 1000, 1 / 30);
  lastT = t;
  const h = dt / SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++) step(h);
  draw();

  if (++hudTick >= 30) {
    hudTick = 0;
    stEl.textContent = sensorLive ? 'IMU LIVE' : 'NO IMU · DRAG TO TILT';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
