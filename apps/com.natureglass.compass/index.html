<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Compass</title>
<style>
  body{
    --bg:#F3F0E7; --fg:#26252E; --mut:#8A8375;
    --chip:#EAE5D8; --line:#CFC9BA; --accent:#C93F28;
  }
  body.night{
    --bg:#0F1219; --fg:#E7EAF3; --mut:#7E8699;
    --chip:#1B2130; --line:#2E3547; --accent:#FF7A50;
  }
  html,body{height:100%}
  body{
    margin:0; overflow:hidden;
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    transition:background-color .5s ease, color .5s ease;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  [hidden]{display:none !important}
  #view{position:fixed; inset:0; width:100%; height:100%; display:block}
  #brand{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:20px;
    font-size:11px; font-weight:600; letter-spacing:.35em; color:var(--mut);
  }
  #status{margin-left:14px; letter-spacing:.25em; color:var(--mut); transition:color .5s ease}
  #status.live{color:var(--accent)}
  #themeToggle,#perm{
    font:600 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    letter-spacing:.12em; text-transform:uppercase;
    color:var(--fg); background:var(--chip);
    border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; cursor:pointer;
    transition:background-color .5s ease, color .5s ease, border-color .5s ease;
  }
  #themeToggle{position:fixed; top:calc(11px + env(safe-area-inset-top)); right:16px}
  #perm{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
  }
  #hud{
    position:fixed; left:0; right:0;
    bottom:calc(4vh + env(safe-area-inset-bottom));
    text-align:center; pointer-events:none;
  }
  #deg{
    font-size: 42px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  #card{
    margin-top:4px; font-size:12px; font-weight:600;
    letter-spacing:.5em; text-indent:.5em; color:var(--mut);
  }
  @media (orientation:landscape){
    #hud{left:auto; right:4vw; top:50%; bottom:auto; transform:translateY(-50%)}
  }
  #fallback{
    position:fixed; inset:0; display:flex;
    align-items:center; justify-content:center;
    font-size:14px; color:var(--mut);
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="brand">COMPASS<span id="status">DEMO</span></div>
<button id="themeToggle" type="button">Night</button>
<div id="hud"><div id="deg">0&#176;</div><div id="card">N</div></div>
<button id="perm" type="button" hidden>Enable compass</button>
<div id="fallback" hidden>WebGL isn't available in this browser.</div>
<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
var PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
function norm(d) { d %= 360; return d < 0 ? d + 360 : d; }
function shortest(d) { d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : d; }
function hx(s) {
  return [
    parseInt(s.slice(1, 3), 16) / 255,
    parseInt(s.slice(3, 5), 16) / 255,
    parseInt(s.slice(5, 7), 16) / 255
  ];
}
function pow2ceil(n) { var p = 1; while (p < n) p <<= 1; return p; }

/* ---------- themes (flat fills only) ---------- */
var DAY = {
  bg: hx('#F3F0E7'), ring: hx('#26252E'),
  tickMinor: hx('#CDC7B8'), tickMid: hx('#97907E'), tickMajor: hx('#26252E'),
  num: hx('#6E6858'), letters: hx('#26252E'), accent: hx('#C93F28'),
  needleS: hx('#B7B1A1'), cap: hx('#26252E'), capDot: hx('#F3F0E7'),
  diamond: hx('#A59E8C')
};
var NIGHT = {
  bg: hx('#0F1219'), ring: hx('#B9BFD1'),
  tickMinor: hx('#2A3040'), tickMid: hx('#47506A'), tickMajor: hx('#C6CCDD'),
  num: hx('#7E8699'), letters: hx('#E7EAF3'), accent: hx('#FF7A50'),
  needleS: hx('#4A5470'), cap: hx('#E7EAF3'), capDot: hx('#0F1219'),
  diamond: hx('#47506A')
};
var themeMix = 0, themeTarget = 0;
function C(k) {
  var a = DAY[k], b = NIGHT[k], m = themeMix;
  return [
    a[0] + (b[0] - a[0]) * m,
    a[1] + (b[1] - a[1]) * m,
    a[2] + (b[2] - a[2]) * m
  ];
}

/* ---------- DOM ---------- */
var canvas = document.getElementById('view');
var degEl = document.getElementById('deg');
var cardEl = document.getElementById('card');
var statusEl = document.getElementById('status');
var permBtn = document.getElementById('perm');
var themeBtn = document.getElementById('themeToggle');
var CARDS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

var state = {
  heading: 210, vel: 0, target: 210,
  live: false, liveCount: 0,
  dragging: false, manualUntil: 0,
  demoOffset: 0, resync: true
};

/* ---------- theme toggle ---------- */
function setTheme(night) {
  themeTarget = night ? 1 : 0;
  document.body.classList.toggle('night', night);
  themeBtn.textContent = night ? 'Day' : 'Night';
}
themeBtn.addEventListener('click', function () { setTheme(themeTarget === 0); });
window.addEventListener('keydown', function (e) {
  if (e.key === 'n' || e.key === 'd' || e.key === ' ') setTheme(themeTarget === 0);
});
var hour = new Date().getHours();
setTheme(hour >= 19 || hour < 7);
themeMix = themeTarget; /* no fade on first paint */

/* ---------- glyph atlas (canvas 2D -> texture) ---------- */
var FONT_PX = 96, CELL_H = 128, PAD = 12;
function makeAtlas(chars) {
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d');
  var font = '600 ' + FONT_PX + 'px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
  ctx.font = font;
  var items = [], total = 0, i, w;
  for (i = 0; i < chars.length; i++) {
    w = Math.ceil(ctx.measureText(chars[i]).width) + PAD;
    items.push({ ch: chars[i], w: w });
    total += w;
  }
  cv.width = pow2ceil(total);
  cv.height = CELL_H;
  ctx = cv.getContext('2d');
  ctx.font = font;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  var map = {}, x = 0;
  for (i = 0; i < items.length; i++) {
    ctx.fillText(items[i].ch, x + PAD / 2, CELL_H / 2);
    map[items[i].ch] = { u0: x / cv.width, u1: (x + items[i].w) / cv.width, w: items[i].w };
    x += items[i].w;
  }
  return { canvas: cv, map: map };
}
var atlas = makeAtlas('NESW0123456789');

/* ---------- geometry (unit dial radius = 1) ---------- */
function pushQuadTick(out, deg, r0, r1, hw) {
  var a = deg * D2R, ux = Math.sin(a), uy = Math.cos(a), rx = uy, ry = -ux;
  var ax = ux * r0, ay = uy * r0, bx = ux * r1, by = uy * r1;
  var x0 = ax - rx * hw, y0 = ay - ry * hw;
  var x1 = ax + rx * hw, y1 = ay + ry * hw;
  var x2 = bx + rx * hw, y2 = by + ry * hw;
  var x3 = bx - rx * hw, y3 = by - ry * hw;
  out.push(
    x0, y0, 0, 0, x1, y1, 0, 0, x2, y2, 0, 0,
    x0, y0, 0, 0, x2, y2, 0, 0, x3, y3, 0, 0
  );
}

function quadLocal(out, cx, cy, rx, ry, ux, uy, x0, y0, x1, y1, u0, u1) {
  function P(lx, ly) { return [cx + rx * lx + ux * ly, cy + ry * lx + uy * ly]; }
  var A = P(x0, y0), B = P(x1, y0), Cc = P(x1, y1), Dd = P(x0, y1);
  out.push(
    A[0], A[1], u0, 0, B[0], B[1], u1, 0, Cc[0], Cc[1], u1, 1,
    A[0], A[1], u0, 0, Cc[0], Cc[1], u1, 1, Dd[0], Dd[1], u0, 1
  );
}

function pushText(out, str, deg, radius, height) {
  var a = deg * D2R, ux = Math.sin(a), uy = Math.cos(a), rx = uy, ry = -ux;
  var cx = ux * radius, cy = uy * radius;
  var upp = height / FONT_PX;       /* world units per atlas px */
  var hh = CELL_H * upp / 2;
  var total = 0, i;
  for (i = 0; i < str.length; i++) total += atlas.map[str[i]].w * upp;
  var cur = -total / 2;
  for (i = 0; i < str.length; i++) {
    var g = atlas.map[str[i]];
    var w = g.w * upp;
    quadLocal(out, cx, cy, rx, ry, ux, uy, cur, -hh, cur + w, hh, g.u0, g.u1);
    cur += w;
  }
}

function ringStrip(r0, r1, seg) {
  var out = [], i, a, s, c;
  for (i = 0; i <= seg; i++) {
    a = i / seg * TAU; s = Math.sin(a); c = Math.cos(a);
    out.push(s * r1, c * r1, 0, 0, s * r0, c * r0, 0, 0);
  }
  return out;
}

function fan(r, seg) {
  var out = [0, 0, 0, 0], i, a;
  for (i = 0; i <= seg; i++) {
    a = i / seg * TAU;
    out.push(Math.sin(a) * r, Math.cos(a) * r, 0, 0);
  }
  return out;
}

function buildGeometry() {
  var minor = [], mid = [], major = [], tickN = [], d;
  for (d = 0; d < 360; d += 2) {
    if (d % 30 === 0) {
      pushQuadTick(d === 0 ? tickN : major, d, 0.858, 0.948, 0.0055);
    } else if (d % 10 === 0) {
      pushQuadTick(mid, d, 0.884, 0.948, 0.0035);
    } else {
      pushQuadTick(minor, d, 0.906, 0.948, 0.002);
    }
  }
  var numbers = [];
  for (d = 0; d < 360; d += 30) pushText(numbers, String(d), d, 0.79, 0.062);
  var letterN = [], lettersESW = [];
  pushText(letterN, 'N', 0, 0.58, 0.14);
  pushText(lettersESW, 'E', 90, 0.58, 0.14);
  pushText(lettersESW, 'S', 180, 0.58, 0.14);
  pushText(lettersESW, 'W', 270, 0.58, 0.14);
  var diamonds = [];
  [45, 135, 225, 315].forEach(function (dd) {
    var a = dd * D2R, x = Math.sin(a) * 0.58, y = Math.cos(a) * 0.58, h = 0.014;
    diamonds.push(
      x, y + h, 0, 0, x + h, y, 0, 0, x, y - h, 0, 0,
      x, y + h, 0, 0, x, y - h, 0, 0, x - h, y, 0, 0
    );
  });
  var needleN = [0, 0.74, 0, 0, -0.047, 0, 0, 0, 0.047, 0, 0, 0];
  var needleS = [0, -0.74, 0, 0, -0.047, 0, 0, 0, 0.047, 0, 0, 0];
  var lubber = [-0.045, 1.085, 0, 0, 0.045, 1.085, 0, 0, 0, 1.0, 0, 0];
  return {
    ring:       { data: ringStrip(0.972, 0.992, 180), mode: 'TRIANGLE_STRIP' },
    minor:      { data: minor, mode: 'TRIANGLES' },
    mid:        { data: mid, mode: 'TRIANGLES' },
    major:      { data: major, mode: 'TRIANGLES' },
    tickN:      { data: tickN, mode: 'TRIANGLES' },
    numbers:    { data: numbers, mode: 'TRIANGLES', tex: true },
    diamonds:   { data: diamonds, mode: 'TRIANGLES' },
    lettersESW: { data: lettersESW, mode: 'TRIANGLES', tex: true },
    letterN:    { data: letterN, mode: 'TRIANGLES', tex: true },
    needleS:    { data: needleS, mode: 'TRIANGLES' },
    needleN:    { data: needleN, mode: 'TRIANGLES' },
    cap:        { data: fan(0.055, 48), mode: 'TRIANGLE_FAN' },
    capDot:     { data: fan(0.02, 32), mode: 'TRIANGLE_FAN' },
    lubber:     { data: lubber, mode: 'TRIANGLES' }
  };
}

/* ---------- WebGL ---------- */
var gl = null, prog = null, uni = {}, bufs = null, tex = null, contextLost = false;

var VS = [
  'attribute vec2 aPos;',
  'attribute vec2 aUV;',
  'uniform vec2 uScale;',
  'uniform float uRot;',
  'varying vec2 vUV;',
  'void main(){',
  '  float c = cos(uRot); float s = sin(uRot);',
  '  vec2 p = vec2(aPos.x*c - aPos.y*s, aPos.x*s + aPos.y*c);',
  '  gl_Position = vec4(p * uScale, 0.0, 1.0);',
  '  vUV = aUV;',
  '}'
].join('\n');

var FS = [
  'precision mediump float;',
  'uniform vec4 uColor;',
  'uniform sampler2D uTex;',
  'uniform float uUseTex;',
  'varying vec2 vUV;',
  'void main(){',
  '  float a = mix(1.0, texture2D(uTex, vUV).a, uUseTex);',
  '  gl_FragColor = vec4(uColor.rgb, uColor.a * a);',
  '}'
].join('\n');

function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s) || 'shader error');
  }
  return s;
}

function initGL() {
  gl = canvas.getContext('webgl', { antialias: true, alpha: false, depth: false, stencil: false });
  if (!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.bindAttribLocation(prog, 1, 'aUV');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('program link failed');
  gl.useProgram(prog);
  uni.scale = gl.getUniformLocation(prog, 'uScale');
  uni.rot = gl.getUniformLocation(prog, 'uRot');
  uni.color = gl.getUniformLocation(prog, 'uColor');
  uni.useTex = gl.getUniformLocation(prog, 'uUseTex');
  gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);

  tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas.canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  var geo = buildGeometry();
  bufs = {};
  Object.keys(geo).forEach(function (k) {
    var g = geo[k], b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(g.data), gl.STATIC_DRAW);
    bufs[k] = { buf: b, count: g.data.length / 4, mode: gl[g.mode], tex: !!g.tex };
  });

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.enableVertexAttribArray(0);
  gl.enableVertexAttribArray(1);
  return true;
}

function draw(name, color, rot) {
  var b = bufs[name];
  gl.bindBuffer(gl.ARRAY_BUFFER, b.buf);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 16, 0);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 16, 8);
  gl.uniform4f(uni.color, color[0], color[1], color[2], 1);
  gl.uniform1f(uni.rot, rot);
  gl.uniform1f(uni.useTex, b.tex ? 1 : 0);
  gl.drawArrays(b.mode, 0, b.count);
}

/* ---------- sizing (portrait + landscape) ---------- */
var scaleX = 1, scaleY = 1;
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  if (gl) gl.viewport(0, 0, w, h);
  var R = Math.min(w, h) * 0.5 * 0.8;
  scaleX = 2 * R / w;
  scaleY = 2 * R / h;
}

/* ---------- sensors ---------- */
function setStatus(txt, live) {
  statusEl.textContent = txt;
  statusEl.className = live ? 'live' : '';
}

function handleOrientation(e) {
  var h = null;
  if (typeof e.webkitCompassHeading === 'number' && isFinite(e.webkitCompassHeading)) {
    h = e.webkitCompassHeading;
  } else if (e.alpha !== null && e.alpha !== undefined) {
    h = 360 - e.alpha;
  }
  if (h === null) return;
  var so = 0;
  try {
    so = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (window.orientation || 0);
  } catch (err) { so = 0; }
  h = norm(h + so);
  state.liveCount++;
  if (state.liveCount >= 3) {
    if (!state.live) { state.live = true; setStatus('LIVE', true); }
    if (!state.dragging) state.target = h;
  }
}

function attachSensors() {
  var gotAbs = false;
  window.addEventListener('deviceorientationabsolute', function (e) {
    if ((e.alpha === null || e.alpha === undefined) &&
        typeof e.webkitCompassHeading !== 'number') return;
    gotAbs = true;
    handleOrientation(e);
  });
  setTimeout(function () {
    if (!gotAbs) window.addEventListener('deviceorientation', handleOrientation);
  }, 1500);
}

if (window.DeviceOrientationEvent &&
    typeof window.DeviceOrientationEvent.requestPermission === 'function') {
  permBtn.hidden = false;
  permBtn.addEventListener('click', function () {
    window.DeviceOrientationEvent.requestPermission().then(function (r) {
      if (r === 'granted') attachSensors();
      permBtn.hidden = true;
    }).catch(function () { permBtn.hidden = true; });
  });
} else {
  attachSensors();
}

/* ---------- drag to rotate (when no live sensor) ---------- */
var lastAng = 0;
function angOf(e) {
  var r = canvas.getBoundingClientRect();
  var x = e.clientX - (r.left + r.width / 2);
  var y = e.clientY - (r.top + r.height / 2);
  return Math.atan2(x, -y); /* clockwise from top */
}
canvas.addEventListener('pointerdown', function (e) {
  if (state.live) return;
  state.dragging = true;
  lastAng = angOf(e);
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function (e) {
  if (!state.dragging) return;
  var a = angOf(e);
  var d = a - lastAng;
  if (d > PI) d -= TAU; else if (d < -PI) d += TAU;
  state.target = norm(state.target - d / D2R);
  lastAng = a;
});
function endDrag() {
  if (!state.dragging) return;
  state.dragging = false;
  state.manualUntil = performance.now() + 4000;
  state.resync = true;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ---------- context loss ---------- */
canvas.addEventListener('webglcontextlost', function (e) {
  e.preventDefault();
  contextLost = true;
});
canvas.addEventListener('webglcontextrestored', function () {
  contextLost = false;
  initGL();
  resize();
});

/* ---------- main loop ---------- */
var lastT = 0, shownDeg = -1;
function frame(now) {
  requestAnimationFrame(frame);
  if (contextLost || !gl) return;
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  resize();

  themeMix += (themeTarget - themeMix) * Math.min(1, dt * 5);

  /* demo wander when no sensor is feeding us */
  if (!state.live && !state.dragging && now > state.manualUntil) {
    var t = now / 1000;
    var raw = t * 2
      + 46 * Math.sin(t * 0.11)
      + 14 * Math.sin(t * 0.27 + 1.7)
      + 5 * Math.sin(t * 0.53 + 0.4);
    if (state.resync) { state.demoOffset = state.target - raw; state.resync = false; }
    state.target = norm(raw + state.demoOffset);
  }

  /* damped spring toward target, shortest arc */
  var diff = shortest(state.target - state.heading);
  state.vel += (34 * diff - 8.5 * state.vel) * dt;
  state.heading = norm(state.heading + state.vel * dt);

  var bg = C('bg');
  gl.clearColor(bg[0], bg[1], bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uni.scale, scaleX, scaleY);

  var rot = state.heading * D2R;
  draw('ring', C('ring'), rot);
  draw('minor', C('tickMinor'), rot);
  draw('mid', C('tickMid'), rot);
  draw('major', C('tickMajor'), rot);
  draw('tickN', C('accent'), rot);
  draw('numbers', C('num'), rot);
  draw('diamonds', C('diamond'), rot);
  draw('lettersESW', C('letters'), rot);
  draw('letterN', C('accent'), rot);
  draw('needleS', C('needleS'), rot);
  draw('needleN', C('accent'), rot);
  draw('cap', C('cap'), rot);
  draw('capDot', C('capDot'), rot);
  draw('lubber', C('accent'), 0);

  var d = Math.round(norm(state.heading)) % 360;
  if (d !== shownDeg) {
    shownDeg = d;
    degEl.textContent = d + '\u00B0';
    cardEl.textContent = CARDS[Math.round(d / 45) % 8];
  }
}

/* ---------- boot ---------- */
try {
  if (!initGL()) throw new Error('no webgl');
} catch (err) {
  document.getElementById('fallback').hidden = false;
  return;
}
setStatus('DEMO', false);
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
