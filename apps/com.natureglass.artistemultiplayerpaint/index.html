<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewser Paint</title>
<style>
  :root {
    --panel: #d4d0c8;
    --panel-dark: #808080;
    --panel-light: #ffffff;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #3a5a78;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px;
    touch-action: none;
  }
  .bar {
    background: var(--panel);
    border: 2px solid;
    border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 100%;
  }
  .bar .title { font-weight: 600; margin-right: 4px; }
  .swatches {
    display: grid;
    grid-template-columns: repeat(8, 18px);
    grid-template-rows: repeat(2, 18px);
    gap: 2px;
  }
  .swatch {
    border: 1px solid var(--panel-dark);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }
  .group { display: flex; align-items: center; gap: 6px; }
  input[type="range"] { width: 90px; }
  #sizeDot {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1px solid var(--panel-dark);
  }
  #sizeDot i {
    display: block; border-radius: 50%; background: var(--ink);
  }
  button.btn {
    font: inherit;
    background: var(--panel);
    border: 2px solid;
    border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light);
    padding: 4px 12px;
    cursor: pointer;
  }
  button.btn:active {
    border-color: var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark);
  }
  #status { display: flex; align-items: center; gap: 6px; }
  #statusDot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #b33; transition: background .3s;
  }
  #statusDot.on { background: #2a2; }
  .stage {
    position: relative;
    width: min(100%, 1280px);
    aspect-ratio: 16 / 9;
    border: 2px solid;
    border-color: var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark);
    background: #fff;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #paint { cursor: crosshair; }
  #overlay { pointer-events: none; }
</style>
</head>
<body>

<div class="bar">
  <span class="title">Brewser Paint</span>
  <div class="swatches" id="swatches"></div>
  <div class="group">
    <input type="color" id="customColor" value="#1a1a1a" title="Custom color">
  </div>
  <div class="group">
    <input type="range" id="size" min="2" max="40" value="6">
    <span id="sizeDot"><i></i></span>
  </div>
  <button class="btn" id="clearBtn">Clear canvas</button>
  <span id="status"><span id="statusDot"></span><span id="statusText">connecting</span></span>
  <span id="roomLabel"></span>
</div>

<div class="stage">
  <canvas id="paint" width="1280" height="720"></canvas>
  <canvas id="overlay" width="1280" height="720"></canvas>
</div>

<script>
/*
  Multipaint — ported to Brewser WebSocket Protocol v1.1

  App-level protocol (unchanged, now carried inside the v1.1 "data" field):
  {t:"s", c:color, w:width, p:[[x,y],...]}   stroke segment, logical 1280x720 coords
  {t:"cur", id, c:color, x, y}               cursor position
  {t:"clear"}                                wipe canvas

  Wire format change vs the old opaque relay:
    - Every message is wrapped in the v1.1 envelope.
      Outbound app event:  {v:1, channel:"app", op:<t>, data:{...}}
      Inbound relayed app: {v:1, channel:"app", op:"message", event:<t>, data:{...}, clientId, seq}
    - The server also sends system-channel frames (joined, presence, error,
      shutdown, ...). We ignore everything that is not channel:"app".
    - app + room are required query params (already provided here).
*/

const PROTOCOL_VERSION = 1;

const ROOM = new URLSearchParams(location.search).get("room") || "paint";
const APPNAME = "com.natureglass.multipaint";
const WS_URL = "wss://ws.brewser.io/?app=" + encodeURIComponent(APPNAME) + "&room=" + encodeURIComponent(ROOM);

const ME = {
  id: Math.random().toString(36).slice(2, 6),
  cursorColor: "hsl(" + Math.floor(Math.random() * 360) + " 70% 45%)"
};

const PALETTE = [
  "#1a1a1a","#7f7f7f","#880015","#ed1c24","#ff7f27","#fff200","#22b14c","#00a2e8",
  "#3f48cc","#a349a4","#ffffff","#c3c3c3","#b97a57","#ffaec9","#b5e61d","#99d9ea"
];

const paint = document.getElementById("paint");
const overlay = document.getElementById("overlay");
const pctx = paint.getContext("2d");
const octx = overlay.getContext("2d");
pctx.lineCap = pctx.lineJoin = "round";

let color = PALETTE[0];
let width = 6;

// Toolbar
const swatchWrap = document.getElementById("swatches");
PALETTE.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "swatch" + (i === 0 ? " active" : "");
  b.style.background = c;
  b.title = c;
  b.onclick = () => setColor(c, b);
  swatchWrap.appendChild(b);
});
function setColor(c, el) {
  color = c;
  document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
  if (el) el.classList.add("active");
  updateSizeDot();
}
document.getElementById("customColor").oninput = e => setColor(e.target.value, null);
const sizeInput = document.getElementById("size");
sizeInput.oninput = () => { width = +sizeInput.value; updateSizeDot(); };
function updateSizeDot() {
  const i = document.querySelector("#sizeDot i");
  const d = Math.min(30, width);
  i.style.width = i.style.height = d + "px";
  i.style.background = color;
}
updateSizeDot();
document.getElementById("roomLabel").textContent = "room: " + ROOM;

// Drawing
function drawSegment(c, w, pts) {
  if (pts.length < 2) {
    pctx.fillStyle = c;
    pctx.beginPath();
    pctx.arc(pts[0][0], pts[0][1], w / 2, 0, 7);
    pctx.fill();
    return;
  }
  pctx.strokeStyle = c;
  pctx.lineWidth = w;
  pctx.beginPath();
  pctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) pctx.lineTo(pts[i][0], pts[i][1]);
  pctx.stroke();
}

function toLogical(e) {
  const r = paint.getBoundingClientRect();
  return [
    Math.round((e.clientX - r.left) / r.width * 1280),
    Math.round((e.clientY - r.top) / r.height * 720)
  ];
}

let drawing = false;
let pending = [];   // points not yet sent
let lastPoint = null;

paint.addEventListener("pointerdown", e => {
  paint.setPointerCapture(e.pointerId);
  drawing = true;
  lastPoint = toLogical(e);
  pending = [lastPoint];
  drawSegment(color, width, [lastPoint]);
});
paint.addEventListener("pointermove", e => {
  const pt = toLogical(e);
  sendCursor(pt);
  if (!drawing) return;
  drawSegment(color, width, [lastPoint, pt]);
  pending.push(pt);
  lastPoint = pt;
});
["pointerup", "pointercancel"].forEach(ev =>
  paint.addEventListener(ev, () => { flushStroke(); drawing = false; })
);

// Flush stroke batches every 40 ms while drawing
setInterval(() => { if (drawing) flushStroke(); }, 40);
function flushStroke() {
  if (pending.length === 0) return;
  sendApp("s", { c: color, w: width, p: pending });
  pending = [lastPoint]; // keep continuity into next batch
}

document.getElementById("clearBtn").onclick = () => {
  pctx.clearRect(0, 0, 1280, 720);
  sendApp("clear", {});
};

// Remote cursors
const cursors = new Map(); // id -> {x, y, c, seen}
function sendCursor(pt) {
  const now = performance.now();
  if (now - (sendCursor.last || 0) < 50) return;
  sendCursor.last = now;
  sendApp("cur", { id: ME.id, c: ME.cursorColor, x: pt[0], y: pt[1] });
}
function renderCursors() {
  octx.clearRect(0, 0, 1280, 720);
  const now = performance.now();
  for (const [id, cur] of cursors) {
    if (now - cur.seen > 3000) { cursors.delete(id); continue; }
    octx.fillStyle = cur.c;
    octx.beginPath();
    octx.arc(cur.x, cur.y, 6, 0, 7);
    octx.fill();
    octx.font = "14px sans-serif";
    octx.fillText(id, cur.x + 10, cur.y + 4);
  }
  requestAnimationFrame(renderCursors);
}
renderCursors();

// WebSocket with auto-reconnect
let ws = null;
let reconnectDelay = 2000;
const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    // Optional v1.1 handshake: advertise ourselves. Any valid message
    // completes the handshake; hello also lets the server label this client.
    sendRaw({
      v: PROTOCOL_VERSION,
      channel: "system",
      op: "hello",
      data: { client: "multipaint/1.1" }
    });
    statusDot.classList.add("on");
    statusText.textContent = "connected";
  };

  ws.onclose = () => {
    statusDot.classList.remove("on");
    statusText.textContent = "reconnecting";
    // The server may send a reconnectAfterMs hint on some closes; a fixed
    // backoff is fine for a drawing toy.
    setTimeout(connect, reconnectDelay);
  };

  ws.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }

    // v1.1: only app-channel relays carry drawing data. Everything else
    // (joined / presence / welcome / error / shutdown) is ignored here.
    if (m.channel !== "app" || m.op !== "message") return;

    const d = m.data || {};
    switch (m.event) {
      case "s":
        drawSegment(d.c, d.w, d.p);
        break;
      case "cur":
        cursors.set(d.id, { x: d.x, y: d.y, c: d.c, seen: performance.now() });
        break;
      case "clear":
        pctx.clearRect(0, 0, 1280, 720);
        break;
    }
  };
}

// Send a v1.1 app event: op is the old "t", payload goes in data.
function sendApp(op, data) {
  sendRaw({ v: PROTOCOL_VERSION, channel: "app", op: op, data: data });
}

function sendRaw(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

connect();
</script>
</body>
</html>
