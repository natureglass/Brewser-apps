<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Showcase of nearly every HTML5 element">
<meta name="author" content="Generated">
<base href="https://example.com/">
<title>Every HTML5 Element</title>
</head>
<style>
  body { background-color: #0b1220; color: #e0e8f4; font-size: 18px; padding: 28px 48px; }
  h2 { color: #7aa2ff; margin-top: 26px; }
  a { color: #7eda9f; }
</style>

<body>

<header>

<section id="forms">
<h2>Forms</h2>
<form action="#" method="post">
<fieldset>
<legend>Personal Info</legend>
<label for="name">Name:</label>
<input type="text" id="name" name="name" placeholder="Your name">
<br>
<label for="email">Email:</label>
<input type="email" id="email" name="email">
<br>
<label for="pwd">Password:</label>
<input type="password" id="pwd" name="pwd">
<br>
<label for="num">Number:</label>
<input type="number" id="num" name="num" min="0" max="100">
<br>
<label for="range">Range:</label>
<input type="range" id="range" name="range" min="0" max="10">
<br>
<label for="date">Date:</label>
<input type="date" id="date" name="date">
<br>
<label for="time">Time:</label>
<input type="time" id="time" name="time">
<br>
<label for="color">Color:</label>
<input type="color" id="color" name="color">
<br>
<label for="file">File:</label>
<input type="file" id="file" name="file">
<br>
<label for="search">Search:</label>
<input type="search" id="search" name="search">
<br>
<label for="tel">Tel:</label>
<input type="tel" id="tel" name="tel">
<br>
<label for="url">URL:</label>
<input type="url" id="url" name="url">
</fieldset>

<fieldset>
<legend>Choices</legend>
<label><input type="checkbox" name="cb" value="1"> Checkbox</label>
<label><input type="radio" name="r" value="a"> Radio A</label>
<label><input type="radio" name="r" value="b"> Radio B</label>
<br>
<label for="sel">Select:</label>
<select id="sel" name="sel">
<optgroup label="Group 1">
<option value="o1">Option 1</option>
<option value="o2">Option 2</option>
</optgroup>
<optgroup label="Group 2">
<option value="o3">Option 3</option>
</optgroup>
</select>
<br>
<label for="ta">Textarea:</label>
<textarea id="ta" name="ta" rows="3" cols="20">Default text</textarea>
<br>
<label for="dl">Datalist:</label>
<input list="options" id="dl" name="dl">
<datalist id="options">
<option value="Alpha">
<option value="Beta">
</datalist>
</fieldset>

<label for="prog">Progress:</label>
<progress id="prog" value="70" max="100">70%</progress>
<br>
<label for="meter">Meter:</label>
<meter id="meter" value="0.6" min="0" max="1">60%</meter>
<br>
<output name="out" for="num range">Output value</output>
<br>
<button type="submit">Submit Button</button>
<button type="reset">Reset</button>
<input type="submit" value="Submit Input">
<input type="button" value="Button Input">
<input type="hidden" name="hidden" value="secret">
</form>
</section>

<p><a href="index.html">back to web experiments</a></p>

</body>
</html>
