<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Fluid Draw</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070b;font-family:system-ui,-apple-system,sans-serif}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  #ui{position:fixed;top:12px;left:12px;display:flex;gap:8px;z-index:5}
  #ui button{background:#0b0e14;color:#dfe6ee;border:1px solid #39445a;padding:9px 12px;
    font:600 11px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0}
  #ui button:active{background:#182031}
  #hint{position:fixed;left:0;right:0;bottom:26px;text-align:center;color:#7d8898;
    font-size:13px;letter-spacing:.03em;pointer-events:none;z-index:4}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#e8eaee;background:#05070b;z-index:10;padding:24px;text-align:center;font-size:14px}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="ui">
  <button id="bBurst">Burst</button>
  <button id="bParticles">Particles: On</button>
  <button id="bFull">Full screen</button>
</div>
<div id="hint">draw with your finger &mdash; multi-touch works</div>
<div id="err"></div>
<script>
"use strict";

const canvas = document.getElementById('c');
const errEl  = document.getElementById('err');
const hintEl = document.getElementById('hint');
function fatal(msg){ errEl.textContent = msg; errEl.style.display = 'flex'; }

const gl = canvas.getContext('webgl2', {
  alpha:false, depth:false, stencil:false, antialias:false, preserveDrawingBuffer:false
});
if (!gl){ fatal('WebGL2 is not available on this device/browser.'); throw new Error('no webgl2'); }

const extCBF  = gl.getExtension('EXT_color_buffer_float');
const extCBHF = extCBF ? null : gl.getExtension('EXT_color_buffer_half_float');
if (!extCBF && !extCBHF){
  fatal('Float render targets unsupported (EXT_color_buffer_float / half_float missing).');
  throw new Error('no float rt');
}

const config = {
  SIM_RESOLUTION: 128,
  DYE_RESOLUTION: 768,
  DENSITY_DISSIPATION: 1.0,
  VELOCITY_DISSIPATION: 0.2,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 20,
  CURL: 30,
  SPLAT_RADIUS: 0.25,
  SPLAT_FORCE: 6000,
  SHADING: true,
  PARTICLES: true,
  PARTICLE_GRID: 128,      // 128x128 = 16384 points
  PARTICLE_SPEED: 1.0,
};
const P = config.PARTICLE_GRID;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

/* ---------- shaders ---------- */

const baseVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPosition;
out vec2 vUv;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const clearFS = `#version 300 es
precision mediump float; precision mediump sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uTexture;
uniform float uValue;
void main(){ o = uValue * texture(uTexture, vUv); }`;

const splatFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uTarget;
uniform float uAspect;
uniform vec3 uColor;
uniform vec2 uPoint;
uniform float uRadius;
void main(){
  vec2 p = vUv - uPoint;
  p.x *= uAspect;
  vec3 splat = exp(-dot(p, p) / uRadius) * uColor;
  vec3 base = texture(uTarget, vUv).xyz;
  o = vec4(base + splat, 1.0);
}`;

const advectFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 uTexelSize;
uniform float uDt;
uniform float uDissipation;
void main(){
  vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexelSize;
  vec4 result = texture(uSource, coord);
  o = result / (1.0 + uDissipation * uDt);
}`;

const divergenceFS = `#version 300 es
precision mediump float; precision mediump sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
void main(){
  vec2 t = uTexelSize;
  float L = texture(uVelocity, vUv - vec2(t.x, 0.0)).x;
  float R = texture(uVelocity, vUv + vec2(t.x, 0.0)).x;
  float B = texture(uVelocity, vUv - vec2(0.0, t.y)).y;
  float T = texture(uVelocity, vUv + vec2(0.0, t.y)).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if (vUv.x - t.x < 0.0) L = -C.x;
  if (vUv.x + t.x > 1.0) R = -C.x;
  if (vUv.y - t.y < 0.0) B = -C.y;
  if (vUv.y + t.y > 1.0) T = -C.y;
  o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`;

const curlFS = `#version 300 es
precision mediump float; precision mediump sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
void main(){
  vec2 t = uTexelSize;
  float L = texture(uVelocity, vUv - vec2(t.x, 0.0)).y;
  float R = texture(uVelocity, vUv + vec2(t.x, 0.0)).y;
  float B = texture(uVelocity, vUv - vec2(0.0, t.y)).x;
  float T = texture(uVelocity, vUv + vec2(0.0, t.y)).x;
  o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`;

const vorticityFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform vec2 uTexelSize;
uniform float uCurlStrength;
uniform float uDt;
void main(){
  vec2 t = uTexelSize;
  float L = texture(uCurl, vUv - vec2(t.x, 0.0)).x;
  float R = texture(uCurl, vUv + vec2(t.x, 0.0)).x;
  float B = texture(uCurl, vUv - vec2(0.0, t.y)).x;
  float T = texture(uCurl, vUv + vec2(0.0, t.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= uCurlStrength * C;
  force.y *= -1.0;
  vec2 velocity = texture(uVelocity, vUv).xy;
  velocity += force * uDt;
  velocity = clamp(velocity, vec2(-1000.0), vec2(1000.0));
  o = vec4(velocity, 0.0, 1.0);
}`;

const pressureFS = `#version 300 es
precision mediump float; precision mediump sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uTexelSize;
void main(){
  vec2 t = uTexelSize;
  float L = texture(uPressure, vUv - vec2(t.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(t.x, 0.0)).x;
  float B = texture(uPressure, vUv - vec2(0.0, t.y)).x;
  float T = texture(uPressure, vUv + vec2(0.0, t.y)).x;
  float div = texture(uDivergence, vUv).x;
  o = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`;

const gradientSubtractFS = `#version 300 es
precision mediump float; precision mediump sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
void main(){
  vec2 t = uTexelSize;
  float L = texture(uPressure, vUv - vec2(t.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(t.x, 0.0)).x;
  float B = texture(uPressure, vUv - vec2(0.0, t.y)).x;
  float T = texture(uPressure, vUv + vec2(0.0, t.y)).x;
  vec2 velocity = texture(uVelocity, vUv).xy;
  velocity -= vec2(R - L, T - B);
  o = vec4(velocity, 0.0, 1.0);
}`;

const displayFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uTexture;
uniform vec2 uTexelSize;
uniform float uShading;
void main(){
  vec3 c = texture(uTexture, vUv).rgb;
  if (uShading > 0.5){
    vec3 lc = texture(uTexture, vUv - vec2(uTexelSize.x, 0.0)).rgb;
    vec3 rc = texture(uTexture, vUv + vec2(uTexelSize.x, 0.0)).rgb;
    vec3 bc = texture(uTexture, vUv - vec2(0.0, uTexelSize.y)).rgb;
    vec3 tc = texture(uTexture, vUv + vec2(0.0, uTexelSize.y)).rgb;
    float dx = length(rc) - length(lc);
    float dy = length(tc) - length(bc);
    vec3 n = normalize(vec3(dx, dy, length(uTexelSize)));
    float diffuse = clamp(n.z + 0.7, 0.7, 1.0);
    c *= diffuse;
  }
  o = vec4(c, 1.0);
}`;

const particleResetFS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform float uSeed;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + uSeed) * 43758.5453); }
void main(){
  o = vec4(hash(vUv), hash(vUv + vec2(17.13, 5.71)), 0.0, 1.0);
}`;

const particleUpdateFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uParticles;
uniform sampler2D uVelocity;
uniform vec2 uSimTexel;
uniform float uDt;
uniform float uTime;
uniform float uSpeed;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 pos = texture(uParticles, vUv).xy;
  vec2 vel = texture(uVelocity, pos).xy;
  pos += vel * uSimTexel * uDt * uSpeed;
  pos = fract(pos + 1.0);                        // wrap at edges
  if (hash(vUv + uTime) < 0.001)                 // sparse respawn keeps coverage even
    pos = vec2(hash(pos + uTime), hash(pos.yx - uTime));
  o = vec4(pos, 0.0, 1.0);
}`;

const particleVS = `#version 300 es
precision highp float;
uniform sampler2D uParticles;
uniform int uStride;
uniform float uPointSize;
out vec2 vPos;
void main(){
  ivec2 texel = ivec2(gl_VertexID % uStride, gl_VertexID / uStride);
  vec2 pos = texelFetch(uParticles, texel, 0).xy;
  vPos = pos;
  gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = uPointSize;
}`;

const particleFS = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vPos; out vec4 o;
uniform sampler2D uDye;
uniform sampler2D uVelocity;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  if (dot(d, d) > 0.25) discard;
  float speed = length(texture(uVelocity, vPos).xy);
  float intensity = clamp(speed * 0.015, 0.01, 0.55);
  vec3 col = texture(uDye, vPos).rgb * 2.2 + vec3(0.02);
  o = vec4(col * intensity, 1.0);
}`;

/* ---------- GL plumbing ---------- */

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('Shader compile: ' + gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('Program link: ' + gl.getProgramInfoLog(p));
  return p;
}
function getUniforms(program){
  const u = {};
  const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const info = gl.getActiveUniform(program, i);
    u[info.name] = gl.getUniformLocation(program, info.name);
  }
  return u;
}
class Prog {
  constructor(vsSrc, fsSrc){
    this.program = link(compile(gl.VERTEX_SHADER, vsSrc), compile(gl.FRAGMENT_SHADER, fsSrc));
    this.u = getUniforms(this.program);
  }
  bind(){ gl.useProgram(this.program); }
}

// Fullscreen quad on an explicit VAO (never rely on default VAO 0 state).
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// Empty VAO for attribute-less point rendering (gl_VertexID only).
const particleVAO = gl.createVertexArray();

function blit(target){
  gl.bindVertexArray(quadVAO);
  if (target == null){
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.width, target.height);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------- format selection with renderability probe ---------- */

function renderable(internalFormat, format, type){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(tex);
  return ok;
}
function pickFormat(candidates){
  for (const c of candidates) if (renderable(c[0], c[1], c[2])) return c;
  return null;
}
const HF = gl.HALF_FLOAT;
const fmtRGBA = pickFormat([[gl.RGBA16F, gl.RGBA, HF], [gl.RGBA32F, gl.RGBA, gl.FLOAT]]);
const fmtRG   = pickFormat([[gl.RG16F, gl.RG, HF], [gl.RGBA16F, gl.RGBA, HF], [gl.RGBA32F, gl.RGBA, gl.FLOAT]]);
const fmtR    = pickFormat([[gl.R16F, gl.RED, HF], [gl.RG16F, gl.RG, HF], [gl.RGBA16F, gl.RGBA, HF]]);
const fmtPos  = pickFormat([[gl.RG32F, gl.RG, gl.FLOAT], [gl.RGBA32F, gl.RGBA, gl.FLOAT], [gl.RGBA16F, gl.RGBA, HF]]);
if (!fmtRGBA || !fmtRG || !fmtR){
  fatal('No renderable float texture format found.');
  throw new Error('no format');
}

/* ---------- FBOs ---------- */

let allocated = [];
function createFBO(w, h, fmt, filter){
  const texture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt[0], w, h, 0, fmt[1], fmt[2], null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  allocated.push({ texture, fbo });
  return {
    texture, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id){
      gl.activeTexture(gl.TEXTURE0 + id);
      gl.bindTexture(gl.TEXTURE_2D, this.texture);
      return id;
    }
  };
}
function createDoubleFBO(w, h, fmt, filter){
  let f1 = createFBO(w, h, fmt, filter);
  let f2 = createFBO(w, h, fmt, filter);
  return {
    width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read(){ return f1; },
    get write(){ return f2; },
    swap(){ const t = f1; f1 = f2; f2 = t; }
  };
}
function disposeAll(){
  for (const a of allocated){ gl.deleteTexture(a.texture); gl.deleteFramebuffer(a.fbo); }
  allocated = [];
}

function getResolution(resolution){
  let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspect < 1) aspect = 1 / aspect;
  const min = Math.round(resolution), max = Math.round(resolution * aspect);
  return gl.drawingBufferWidth > gl.drawingBufferHeight
    ? { width: max, height: min }
    : { width: min, height: max };
}

/* ---------- programs ---------- */

const clearProg     = new Prog(baseVS, clearFS);
const splatProg     = new Prog(baseVS, splatFS);
const advectProg    = new Prog(baseVS, advectFS);
const divergeProg   = new Prog(baseVS, divergenceFS);
const curlProg      = new Prog(baseVS, curlFS);
const vorticityProg = new Prog(baseVS, vorticityFS);
const pressureProg  = new Prog(baseVS, pressureFS);
const gradientProg  = new Prog(baseVS, gradientSubtractFS);
const displayProg   = new Prog(baseVS, displayFS);
const pResetProg    = fmtPos ? new Prog(baseVS, particleResetFS)  : null;
const pUpdateProg   = fmtPos ? new Prog(baseVS, particleUpdateFS) : null;
const pRenderProg   = fmtPos ? new Prog(particleVS, particleFS)   : null;
if (!fmtPos) config.PARTICLES = false;

/* ---------- state ---------- */

let dye, velocity, divergence, curl, pressure, particles;

function resetParticles(){
  if (!particles) return;
  pResetProg.bind();
  gl.uniform1f(pResetProg.u.uSeed, Math.random() * 100);
  blit(particles.write);
  particles.swap();
}

function initFramebuffers(){
  disposeAll();
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  velocity   = createDoubleFBO(simRes.width, simRes.height, fmtRG,   gl.LINEAR);
  dye        = createDoubleFBO(dyeRes.width, dyeRes.height, fmtRGBA, gl.LINEAR);
  divergence = createFBO(simRes.width, simRes.height, fmtR, gl.NEAREST);
  curl       = createFBO(simRes.width, simRes.height, fmtR, gl.NEAREST);
  pressure   = createDoubleFBO(simRes.width, simRes.height, fmtR, gl.NEAREST);
  particles  = fmtPos ? createDoubleFBO(P, P, fmtPos, gl.NEAREST) : null;
  resetParticles();
}

function resizeCanvas(){
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
    return true;
  }
  return false;
}

/* ---------- simulation ---------- */

function step(dt){
  gl.disable(gl.BLEND);
  const tx = velocity.texelSizeX, ty = velocity.texelSizeY;

  curlProg.bind();
  gl.uniform2f(curlProg.u.uTexelSize, tx, ty);
  gl.uniform1i(curlProg.u.uVelocity, velocity.read.attach(0));
  blit(curl);

  vorticityProg.bind();
  gl.uniform2f(vorticityProg.u.uTexelSize, tx, ty);
  gl.uniform1i(vorticityProg.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProg.u.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProg.u.uCurlStrength, config.CURL);
  gl.uniform1f(vorticityProg.u.uDt, dt);
  blit(velocity.write);
  velocity.swap();

  divergeProg.bind();
  gl.uniform2f(divergeProg.u.uTexelSize, tx, ty);
  gl.uniform1i(divergeProg.u.uVelocity, velocity.read.attach(0));
  blit(divergence);

  clearProg.bind();
  gl.uniform1i(clearProg.u.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProg.u.uValue, config.PRESSURE);
  blit(pressure.write);
  pressure.swap();

  pressureProg.bind();
  gl.uniform2f(pressureProg.u.uTexelSize, tx, ty);
  gl.uniform1i(pressureProg.u.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++){
    gl.uniform1i(pressureProg.u.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  gradientProg.bind();
  gl.uniform2f(gradientProg.u.uTexelSize, tx, ty);
  gl.uniform1i(gradientProg.u.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradientProg.u.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  advectProg.bind();
  gl.uniform2f(advectProg.u.uTexelSize, tx, ty);
  const velId = velocity.read.attach(0);
  gl.uniform1i(advectProg.u.uVelocity, velId);
  gl.uniform1i(advectProg.u.uSource, velId);
  gl.uniform1f(advectProg.u.uDt, dt);
  gl.uniform1f(advectProg.u.uDissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(advectProg.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectProg.u.uSource, dye.read.attach(1));
  gl.uniform1f(advectProg.u.uDissipation, config.DENSITY_DISSIPATION);
  blit(dye.write);
  dye.swap();

  if (particles && config.PARTICLES){
    pUpdateProg.bind();
    gl.uniform1i(pUpdateProg.u.uParticles, particles.read.attach(0));
    gl.uniform1i(pUpdateProg.u.uVelocity, velocity.read.attach(1));
    gl.uniform2f(pUpdateProg.u.uSimTexel, tx, ty);
    gl.uniform1f(pUpdateProg.u.uDt, dt);
    gl.uniform1f(pUpdateProg.u.uTime, (performance.now() % 10000) / 100);
    gl.uniform1f(pUpdateProg.u.uSpeed, config.PARTICLE_SPEED);
    blit(particles.write);
    particles.swap();
  }
}

function render(){
  gl.disable(gl.BLEND);
  displayProg.bind();
  gl.uniform2f(displayProg.u.uTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1f(displayProg.u.uShading, config.SHADING ? 1.0 : 0.0);
  gl.uniform1i(displayProg.u.uTexture, dye.read.attach(0));
  blit(null);

  if (particles && config.PARTICLES){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    pRenderProg.bind();
    gl.uniform1i(pRenderProg.u.uParticles, particles.read.attach(0));
    gl.uniform1i(pRenderProg.u.uDye, dye.read.attach(1));
    gl.uniform1i(pRenderProg.u.uVelocity, velocity.read.attach(2));
    gl.uniform1i(pRenderProg.u.uStride, P);
    gl.uniform1f(pRenderProg.u.uPointSize, Math.max(1.0, 1.5 * dpr));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindVertexArray(particleVAO);
    gl.drawArrays(gl.POINTS, 0, P * P);
    gl.disable(gl.BLEND);
  }
}

/* ---------- splats ---------- */

function correctRadius(radius){
  const aspect = canvas.width / canvas.height;
  if (aspect > 1) radius *= aspect;
  return radius;
}

function splat(x, y, dx, dy, color){
  splatProg.bind();
  gl.uniform1f(splatProg.u.uAspect, canvas.width / canvas.height);
  gl.uniform2f(splatProg.u.uPoint, x, y);
  gl.uniform1f(splatProg.u.uRadius, correctRadius(config.SPLAT_RADIUS / 100.0));

  gl.uniform1i(splatProg.u.uTarget, velocity.read.attach(0));
  gl.uniform3f(splatProg.u.uColor, dx, dy, 0.0);
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProg.u.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProg.u.uColor, color.r, color.g, color.b);
  blit(dye.write);
  dye.swap();
}

function hsv(h, s, v){
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6){
    case 0: r=v; g=t; b=p; break;
    case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=t; break;
    case 3: r=p; g=q; b=v; break;
    case 4: r=t; g=p; b=v; break;
    default: r=v; g=p; b=q;
  }
  return { r, g, b };
}

function strokeColor(ptr){
  // hue drifts slowly over the stroke for rainbow trails
  const h = (ptr.hue + performance.now() * 0.00005) % 1;
  const c = hsv(h, 1.0, 1.0);
  return { r: c.r * 0.18, g: c.g * 0.18, b: c.b * 0.18 };
}

function multipleSplats(n){
  for (let i = 0; i < n; i++){
    const c = hsv(Math.random(), 1.0, 1.0);
    splat(
      Math.random(), Math.random(),
      1000 * (Math.random() - 0.7), 1000 * (Math.random() - 0.9),
      { r: c.r * 1, g: c.g * 1, b: c.b * 1 }
    );
  }
}

/* ---------- input ---------- */

const pointers = new Map();
let hintShown = true;
function hideHint(){
  if (hintShown){ hintEl.style.display = 'none'; hintShown = false; }
}
function pointerUv(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width,
    y: 1.0 - (clientY - rect.top) / rect.height
  };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_){}
  const p = pointerUv(e.clientX, e.clientY);
  const ptr = { x: p.x, y: p.y, hue: Math.random() };
  pointers.set(e.pointerId, ptr);
  splat(p.x, p.y, 0, 0, strokeColor(ptr));
  hideHint();
});

canvas.addEventListener('pointermove', e => {
  const ptr = pointers.get(e.pointerId);
  if (!ptr) return;
  e.preventDefault();
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  const aspect = canvas.width / canvas.height;
  for (const ev of events){
    const p = pointerUv(ev.clientX, ev.clientY);
    let dx = p.x - ptr.x;
    let dy = p.y - ptr.y;
    if (aspect < 1) dx *= aspect; else dy /= aspect;
    ptr.x = p.x;
    ptr.y = p.y;
    if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) continue;
    // splat force = pointer velocity vector (speed + orientation of the stroke)
    splat(p.x, p.y, dx * config.SPLAT_FORCE, dy * config.SPLAT_FORCE, strokeColor(ptr));
  }
});

for (const t of ['pointerup', 'pointercancel'])
  canvas.addEventListener(t, e => pointers.delete(e.pointerId));
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- UI ---------- */

document.getElementById('bBurst').addEventListener('click', () => { multipleSplats(6); hideHint(); });
const bParticles = document.getElementById('bParticles');
if (!fmtPos){ bParticles.style.display = 'none'; }
bParticles.addEventListener('click', () => {
  config.PARTICLES = !config.PARTICLES;
  bParticles.textContent = 'Particles: ' + (config.PARTICLES ? 'On' : 'Off');
});
function isEffectivelyFullscreen() {
  return !!document.fullscreenElement
    || matchMedia('(display-mode: fullscreen)').matches
    || (innerWidth === screen.width && innerHeight === screen.height);
}

function canRequestFullscreen() {
  return document.fullscreenEnabled && !isEffectivelyFullscreen();
}

const bFull = document.getElementById('bFull');
function updateFullscreenLabel() {
  bFull.textContent = isEffectivelyFullscreen() ? 'Exit Fullscreen' : 'Enter Fullscreen';
}
updateFullscreenLabel();
bFull.addEventListener('click', async () => {
  if (isEffectivelyFullscreen()) {
    await document.exitFullscreen();
  } else if (canRequestFullscreen()) {
    await document.documentElement.requestFullscreen();
  }
  updateFullscreenLabel();
});
document.addEventListener('fullscreenchange', updateFullscreenLabel);
window.addEventListener('resize', updateFullscreenLabel);

/* ---------- main loop ---------- */

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (resizeCanvas()) initFramebuffers();
  if (dt > 0) step(dt);
  render();
  requestAnimationFrame(frame);
}

try {
  resizeCanvas();
  initFramebuffers();
  multipleSplats(5);
  requestAnimationFrame(frame);
} catch (err){
  fatal('Init failed: ' + err.message);
  throw err;
}
</script>
</body>
