<!doctype html>
<html lang="en">
<head>
<title>Unity Demos — runner</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, user-scalable=yes">
<style>
  * { padding: 0; margin: 0; }
  html, body { height: 100%; width: 100%; }
  body { background-color: #0b1220; color: #e0e8f4; font-family: Arial, Helvetica, sans-serif; }
  #harness-status {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(11, 18, 32, 0.9);
    color: #ffd35e;
    padding: 6px 14px;
    font-size: 13px;
    font-family: 'Geist Mono', 'Consolas', 'Menlo', monospace;
    border-bottom: 1px solid #24345c;
    z-index: 999;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #harness-status .k { color: #7aa2ff; }
  #harness-status .ok { color: #7eda9f; }
  #harness-status .fail { color: #ff9090; }
  #unity-container {
    position: absolute;
    left: 0; top: 30px;
    width: 100%;
    height: calc(100% - 30px);
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #222;
  }
  #unity-canvas {
    width: 100%;
    height: 100%;
    background-color: #000;
  }
</style>
</head>
<body>
<div id="harness-status">Unity Demos harness — booting…</div>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="0"></canvas>
</div>

<!-- Load order matters (Phase 1 §C):
     1. ndjson.js  — writer must be ready before any other script runs so
                     errors during subsequent script load are logged.
     2. wasm-probe.js  — reads WebAssembly BEFORE interceptor wraps ctors.
     3. interceptor.js — installs env-mods + hooks.
     4. runner.js     — reads demo.json + loads the vendored Unity build. -->
<script src="ndjson.js"></script>
<script src="wasm-probe.js"></script>
<script src="interceptor.js"></script>
<script src="runner.js"></script>
</body>
</html>
