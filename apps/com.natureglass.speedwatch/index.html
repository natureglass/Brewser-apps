<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f2f3f5">
<title>SpeedWatch</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --ink: #14181d;
    --ink-dim: #5c6670;
    --line: #d9dde2;
    --ok: #1fa860;
    --over: #e5343f;
    --accent: #1668e3;
    --chip-bg: rgba(255,255,255,.92);
    --shadow: 0 2px 10px rgba(10,14,18,.14);
    /* DIN is the typeface of European road signage; Bahnschrift is Windows' DIN.
       Falls back to system UI. Zero font downloads. */
    --font: "DIN Alternate","Bahnschrift","DIN Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .night {
    --bg: #0a0e12;
    --panel: #10151b;
    --ink: #e8ecef;
    --ink-dim: #8a939c;
    --line: #232a32;
    --ok: #2ecc76;
    --over: #ff4d55;
    --accent: #4d94ff;
    --chip-bg: rgba(16,21,27,.92);
    --shadow: 0 2px 10px rgba(0,0,0,.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    user-select: none;
    transition: background .25s, color .25s;
  }

  /* ---------- Layout: portrait = column, landscape = row ---------- */
  #app { display:flex; flex-direction:column; height:100dvh; }
  #mapWrap { position:relative; flex: 1.15; min-height:0; min-width:0; background:var(--panel); overflow:hidden; }
  #panel   { position:relative; flex: 1;    min-height:0; min-width:0;
             display:flex; align-items:center; justify-content:center;
             background:var(--panel); border-top:1px solid var(--line); }
  @media (orientation: landscape) {
    #app { flex-direction:row; }
    #panel { border-top:none; border-left:1px solid var(--line); }
  }

  #mapCv { position:absolute; inset:0; width:100%; height:100%; touch-action:none;
           background:#dfe6ea; cursor:grab; }
  .night #mapCv { background:#141a20; }
  #gauge { display:block; touch-action:none; }

  /* ---------- Chips & buttons ---------- */
  .chip {
    position:absolute; z-index:5; display:flex; align-items:center; gap:7px;
    background:var(--chip-bg); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow); backdrop-filter: blur(6px);
  }
  .dot { width:9px; height:9px; border-radius:50%; background:#b9c0c7; flex:none; }
  .dot.fix  { background:var(--ok); }
  .dot.err  { background:var(--over); }
  #gpsChip { top: calc(10px + env(safe-area-inset-top)); left:10px; }

  #btnRow {
    position:absolute; z-index:5; top: calc(10px + env(safe-area-inset-top)); right:10px;
    display:flex; gap:8px;
  }
  .iconBtn {
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--chip-bg); color:var(--ink); box-shadow:var(--shadow);
    font-size:19px; line-height:1; cursor:pointer; backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  .iconBtn.offState { opacity:.45; }
  .iconBtn:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  #zoomCol {
    position:absolute; z-index:5; right:10px; bottom:14px;
    display:flex; flex-direction:column; gap:8px;
  }
  #zoomCol .iconBtn { font-size:23px; font-weight:700; }

  #osmCredit {
    position:absolute; z-index:5; left:8px; bottom:8px;
    font-size:10.5px; color:var(--ink-dim);
    background:var(--chip-bg); border-radius:6px; padding:2px 7px;
  }
  #osmCredit a { color:var(--ink-dim); }

  #recenter {
    position:absolute; z-index:5; bottom:14px; left:50%; transform:translateX(-50%);
    display:none; border-radius:999px; border:1px solid var(--line);
    background:var(--chip-bg); color:var(--accent); font-family:var(--font);
    font-size:14px; font-weight:700; padding:9px 16px; box-shadow:var(--shadow); cursor:pointer;
  }
  #recenter.show { display:block; }

  /* ---------- Settings drawer ---------- */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9; display:none; }
  #scrim.open { display:block; }
  #drawer {
    position:fixed; z-index:10; left:0; right:0; bottom:0;
    background:var(--panel); color:var(--ink);
    border-radius:18px 18px 0 0; border-top:1px solid var(--line);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .28s ease;
    max-height:82dvh; overflow:auto;
  }
  #drawer.open { transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { #drawer { transition:none; } }
  #drawer h2 { font-size:17px; margin-bottom:14px; letter-spacing:.02em; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px; font-weight:600; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button {
    flex:1; padding:10px 0; font-size:14px; font-weight:700; font-family:var(--font);
    background:var(--bg); color:var(--ink-dim); border:none; cursor:pointer;
  }
  .seg button.sel { background:var(--accent); color:#fff; }
  .rowField { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .switch { position:relative; width:50px; height:29px; flex:none; }
  .switch input { opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; }
  .knob { position:absolute; inset:0; border-radius:999px; background:var(--line); transition:.18s; pointer-events:none; }
  .knob::after { content:""; position:absolute; top:3px; left:3px; width:23px; height:23px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.18s; }
  .switch input:checked + .knob { background:var(--ok); }
  .switch input:checked + .knob::after { transform:translateX(21px); }
  .hint { font-size:12.5px; color:var(--ink-dim); line-height:1.45; margin-top:6px; }
  #saveBtn {
    width:100%; padding:13px; margin-top:4px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-family:var(--font);
    font-size:16px; font-weight:700; cursor:pointer;
  }
</style>

<!-- brewser-pwa:start -->
<link rel="manifest" href="pwa/app.webmanifest">
<meta name="theme-color" content="#271e23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<script src="pwa/brewser-pwa.js" defer></script>
<!-- brewser-pwa:end -->
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="mapCv"></canvas>
    <div class="chip" id="gpsChip"><span class="dot" id="gpsDot"></span><span id="gpsTxt">Acquiring GPS&#8230;</span></div>
    <div id="btnRow">
      <button class="iconBtn" id="soundBtn" title="Sound alerts">&#128266;</button>
      <button class="iconBtn" id="nightBtn" title="Night mode">&#127769;</button>
      <button class="iconBtn" id="gearBtn"  title="Settings">&#9881;&#65039;</button>
    </div>
    <div id="zoomCol">
      <button class="iconBtn" id="zoomIn"  title="Zoom in">+</button>
      <button class="iconBtn" id="zoomOut" title="Zoom out">&#8722;</button>
    </div>
    <div id="osmCredit">&#169; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
    <button id="recenter">Re-center</button>
  </div>

  <div id="panel"><canvas id="gauge"></canvas></div>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer" role="dialog" aria-label="Settings">
  <h2>Settings</h2>

  <div class="field">
    <label>Units</label>
    <div class="seg" id="unitSeg">
      <button data-u="kmh">km/h</button>
      <button data-u="mph">mph</button>
    </div>
  </div>

  <div class="field">
    <label>Alert tolerance (alerts start this far over the limit)</label>
    <div class="seg" id="tolSeg">
      <button data-t="0">0</button>
      <button data-t="3">+3</button>
      <button data-t="5">+5</button>
      <button data-t="10">+10</button>
    </div>
  </div>

  <div class="field rowField">
    <label style="margin:0">Keep screen awake while driving</label>
    <span class="switch"><input type="checkbox" id="wakeSw" checked><span class="knob"></span></span>
  </div>

  <div class="field rowField">
    <label style="margin:0">Demo drive (fake GPS, for testing on a desk)</label>
    <span class="switch"><input type="checkbox" id="demoSw"><span class="knob"></span></span>
  </div>

  <div class="hint" style="margin-bottom:14px">Map and speed limits come from OpenStreetMap &#8212; no API key needed.</div>

  <button id="saveBtn" onclick="saveSettings()">Save</button>
</div>

<script>
"use strict";
/* =====================================================================
   SpeedWatch — canvas speedometer + limit alerts + canvas OSM map.
   Single file, no libraries, no API keys.
   Map tiles + speed limits: OpenStreetMap (tile server + Overpass).
   ===================================================================== */

/* ---------------- Settings ---------------- */
const DEFAULTS = { unit:"kmh", tol:3, sound:true, night:false, wake:true, demo:false };
let S = loadSettings();
function loadSettings(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem("speedwatch")||"{}")); }
  catch(e){ return {...DEFAULTS}; }
}
function persist(){ localStorage.setItem("speedwatch", JSON.stringify(S)); }

/* ---------------- App state ---------------- */
const st = {
  lat:null, lon:null, acc:null,
  speedKmh:0, dispKmh:0, heading:0,
  limitKmh:null, limitNone:false, limitAt:0,   // limitAt = timestamp of last good limit
  over:false, fix:false, gpsErr:null,
  lastPos:null, lastQuery:null, querying:false,
  follow:true, demoT:0,
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const gaugeCv = $("gauge"), ctx = gaugeCv.getContext("2d");
const mapCv = $("mapCv"), mtx = mapCv.getContext("2d");

/* ---------------- Units ---------------- */
const toUnit = k => S.unit==="mph" ? k*0.621371 : k;
const unitLbl = () => S.unit==="mph" ? "mph" : "km/h";
const scaleMax = () => S.unit==="mph" ? 120 : 200;   // gauge full-scale
const majorStep = () => S.unit==="mph" ? 20 : 20;

/* =====================================================================
   GPS
   ===================================================================== */
let watchId = null;
function startGPS(){
  if (S.demo) { startDemo(); return; }
  if (!("geolocation" in navigator)) { gpsError("No geolocation"); return; }
  watchId = navigator.geolocation.watchPosition(onPos, e=>{
    gpsError(e.code===1 ? "Location permission denied" : "GPS signal lost");
  }, { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
}
function stopGPS(){
  if (watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  stopDemo();
}
function gpsError(msg){
  st.fix=false; st.gpsErr=msg;
  $("gpsDot").className="dot err"; $("gpsTxt").textContent=msg;
}
function onPos(p){
  const c=p.coords, t=p.timestamp;
  let v = c.speed;                                   // m/s or null
  if (v==null && st.lastPos){                        // fallback: derive from movement
    const dt=(t-st.lastPos.t)/1000;
    if (dt>0.3){ v = haversine(st.lastPos.lat,st.lastPos.lon,c.latitude,c.longitude)/dt; }
  }
  if (v==null || !isFinite(v) || v<0) v=0;
  if (c.accuracy>40 && v*3.6<8) v=0;                 // kill jitter creep when parked
  feedFix(c.latitude, c.longitude, c.accuracy, v*3.6,
          (c.heading!=null && !isNaN(c.heading)) ? c.heading : null, t);
}
function feedFix(lat,lon,acc,kmh,heading,t){
  if (heading==null && st.lastPos){
    const d=haversine(st.lastPos.lat,st.lastPos.lon,lat,lon);
    if (d>3) heading = bearing(st.lastPos.lat,st.lastPos.lon,lat,lon);
  }
  if (heading!=null) st.heading = heading;
  const firstFix = st.lat==null;
  st.lat=lat; st.lon=lon; st.acc=acc; st.fix=true; st.gpsErr=null;
  st.speedKmh = st.speedKmh*0.55 + kmh*0.45;         // low-pass smoothing
  if (st.speedKmh < 0.8) st.speedKmh = 0;
  st.lastPos = {lat,lon,t};
  if (firstFix){ view.lat=lat; view.lon=lon; }
  $("gpsDot").className="dot fix";
  $("gpsTxt").textContent = "GPS \u00B1" + Math.round(acc) + " m";
  maybeQueryLimit(); scheduleMap(); evalAlert();
}
function haversine(a,b,c,d){
  const R=6371000, r=Math.PI/180, dLa=(c-a)*r, dLo=(d-b)*r;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b,c,d){
  const r=Math.PI/180, y=Math.sin((d-b)*r)*Math.cos(c*r);
  const x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);
  return (Math.atan2(y,x)/r+360)%360;
}

/* =====================================================================
   Speed limits — OSM Overpass (no key needed)
   ===================================================================== */
const OVERPASS = ["https://overpass-api.de/api/interpreter",
                  "https://overpass.kumi.systems/api/interpreter"];
let opIdx = 0;
function maybeQueryLimit(){
  if (st.querying || st.lat==null) return;
  const now = Date.now();
  const moved = st.lastQuery ? haversine(st.lastQuery.lat,st.lastQuery.lon,st.lat,st.lon) : 1e9;
  const age   = st.lastQuery ? now-st.lastQuery.t : 1e9;
  if (moved < 120 && age < 20000) return;            // throttle: 120 m or 20 s
  st.querying = true;
  st.lastQuery = {lat:st.lat, lon:st.lon, t:now};
  const q = `[out:json][timeout:6];way(around:28,${st.lat.toFixed(6)},${st.lon.toFixed(6)})[highway][maxspeed];out geom;`;
  fetch(OVERPASS[opIdx], { method:"POST", body:"data="+encodeURIComponent(q),
        headers:{ "Content-Type":"application/x-www-form-urlencoded" } })
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ pickLimit(j.elements||[]); })
    .catch(()=>{ opIdx = (opIdx+1)%OVERPASS.length; })   // rotate mirror on failure
    .finally(()=>{ st.querying=false; });
}
function pickLimit(ways){
  let best=null, bestScore=1e9;
  for (const w of ways){
    const kmh = parseMaxspeed(w.tags && w.tags.maxspeed);
    if (kmh===undefined) continue;
    const g = w.geometry||[];
    let dist=1e9, segBear=0;
    for (let i=0;i<g.length-1;i++){
      const r = distToSeg(st.lat,st.lon,g[i].lat,g[i].lon,g[i+1].lat,g[i+1].lon);
      if (r.d<dist){ dist=r.d; segBear=bearing(g[i].lat,g[i].lon,g[i+1].lat,g[i+1].lon); }
    }
    let mis=0;
    if (st.speedKmh>10){                              // prefer the road we're aligned with
      const diff=Math.abs(((st.heading-segBear)%360+360)%360);
      mis=Math.min(diff,Math.abs(diff-180),360-diff);
    }
    const score = dist + mis*0.25;
    if (score<bestScore){ bestScore=score; best=kmh; }
  }
  if (best!==null){
    st.limitNone = (best===Infinity);
    st.limitKmh  = st.limitNone ? null : best;
    st.limitAt   = Date.now();
  }
}
function parseMaxspeed(v){
  if (!v) return undefined;
  v=String(v).trim().toLowerCase();
  if (v==="none")   return Infinity;                  // explicit "no limit"
  if (v==="walk")   return 7;
  const mph=v.match(/^(\d+(?:\.\d+)?)\s*mph$/); if (mph) return parseFloat(mph[1])*1.60934;
  const kn =v.match(/^(\d+(?:\.\d+)?)\s*knots?$/); if (kn) return parseFloat(kn[1])*1.852;
  const num=v.match(/^(\d+(?:\.\d+)?)$/);          if (num) return parseFloat(num[1]);
  return undefined;
}
function distToSeg(pLat,pLon,aLat,aLon,bLat,bLon){   // equirectangular, fine at 30 m scale
  const r=Math.PI/180, cos=Math.cos(pLat*r), M=111320;
  const px=0, py=0;
  const ax=(aLon-pLon)*cos*M, ay=(aLat-pLat)*M;
  const bx=(bLon-pLon)*cos*M, by=(bLat-pLat)*M;
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  t=Math.max(0,Math.min(1,t));
  const cx=ax+t*dx, cy=ay+t*dy;
  return { d:Math.hypot(cx-px,cy-py) };
}
function currentLimit(){                              // stale after 2.5 min without refresh
  if (Date.now()-st.limitAt > 150000) return {kmh:null, none:false};
  return {kmh:st.limitKmh, none:st.limitNone};
}

/* =====================================================================
   Alerts — hysteresis + repeating beeps (the "speed robot")
   ===================================================================== */
let audioCtx=null, lastBeep=0;
function ensureAudio(){
  if (!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if (AC) audioCtx=new AC();
  }
  if (audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
document.addEventListener("pointerdown", ensureAudio, {once:false});

function beep(freq,dur,when,vol){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(vol,when+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(when); o.stop(when+dur+0.03);
}
function overChirp(){ if(!audioCtx)return; const t=audioCtx.currentTime;
  beep(1050,.09,t,.28); beep(1050,.09,t+.14,.28); beep(1320,.12,t+.28,.3); }
function okChirp(){ if(!audioCtx)return; beep(560,.14,audioCtx.currentTime,.18); }

function evalAlert(){
  const L=currentLimit();
  let over=false;
  if (L.kmh!=null){
    if (!st.over) over = st.speedKmh > L.kmh + S.tol;         // arm above limit+tol
    else          over = st.speedKmh > L.kmh + S.tol - 2;     // disarm 2 km/h lower
  }
  if (over && !st.over && S.sound){ ensureAudio(); overChirp(); lastBeep=Date.now(); }
  if (!over && st.over && S.sound){ okChirp(); }
  st.over = over;
}
setInterval(()=>{                                     // nag while still speeding
  if (st.over && S.sound && Date.now()-lastBeep>2500){ overChirp(); lastBeep=Date.now(); }
}, 400);

/* =====================================================================
   Gauge — canvas speedometer (the hero)
   ===================================================================== */
function sizeGauge(){
  const box=$("panel").getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  const side=Math.min(box.width, box.height) - 14;
  gaugeCv.style.width=side+"px"; gaugeCv.style.height=side+"px";
  gaugeCv.width=Math.round(side*dpr); gaugeCv.height=Math.round(side*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const A0=135, A1=405;                                 // 270° sweep
const rad=a=>a*Math.PI/180;
const angFor=(v,max)=>rad(A0+(A1-A0)*Math.min(v,max)/max);

function css(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }

function drawGauge(){
  const w=gaugeCv.clientWidth; if(!w) return;
  const cx=w/2, cy=w/2, R=w/2-10;
  const max=scaleMax(), L=currentLimit();
  const limU = L.kmh!=null ? Math.round(toUnit(L.kmh)) : null;
  const spd  = toUnit(st.dispKmh);
  const night=S.night;
  const cOK=css("--ok"), cOver=css("--over"), cInk=css("--ink"),
        cDim=css("--ink-dim"), cLine=css("--line");
  const status = st.over ? cOver : (L.kmh!=null||L.none ? cOK : cDim);

  ctx.clearRect(0,0,w,w);

  /* track */
  ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(cx,cy,R*0.86,rad(A0),rad(A1));
  ctx.lineWidth=R*0.085; ctx.strokeStyle=night?"#1b232c":"#e6e9ed"; ctx.stroke();

  /* legal zone: green up to the limit, red beyond it */
  if (limU!=null){
    const aL=angFor(limU,max);
    ctx.beginPath(); ctx.arc(cx,cy,R*0.86,rad(A0),aL);
    ctx.strokeStyle=night?"rgba(46,204,118,.28)":"rgba(31,168,96,.22)"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,R*0.86,aL,rad(A1));
    ctx.strokeStyle=night?"rgba(255,77,85,.30)":"rgba(229,52,63,.20)"; ctx.stroke();
  }

  /* live speed arc */
  if (spd>0.5){
    ctx.beginPath(); ctx.arc(cx,cy,R*0.86,rad(A0),angFor(spd,max));
    ctx.lineWidth=R*0.085; ctx.strokeStyle=status;
    ctx.shadowColor=status; ctx.shadowBlur=st.over?R*0.10:R*0.04;
    ctx.stroke(); ctx.shadowBlur=0;
  }

  /* ticks + numerals */
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let v=0; v<=max; v+=majorStep()/2){
    const major = v%majorStep()===0, a=angFor(v,max);
    const r1=R*0.955, r2=major?R*0.90:R*0.925;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
    ctx.lineWidth=major?2:1; ctx.strokeStyle=major?cDim:cLine; ctx.stroke();
    if(major){
      ctx.font=`600 ${Math.round(R*0.085)}px ${css("--font")}`;
      ctx.fillStyle=cDim;
      ctx.fillText(v, cx+Math.cos(a)*R*0.76, cy+Math.sin(a)*R*0.76);
    }
  }

  /* limit marker on the arc */
  if (limU!=null){
    const a=angFor(limU,max);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*R*0.985, cy+Math.sin(a)*R*0.985);
    ctx.lineTo(cx+Math.cos(a)*R*0.875, cy+Math.sin(a)*R*0.875);
    ctx.lineWidth=4; ctx.strokeStyle=cOver; ctx.stroke();
  }

  /* needle */
  const a=angFor(Math.max(spd,0),max);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
  ctx.beginPath();
  ctx.moveTo(-R*0.06,0); ctx.lineTo(R*0.70,-R*0.016); ctx.lineTo(R*0.70,R*0.016); ctx.closePath();
  ctx.fillStyle=status; ctx.shadowColor=status; ctx.shadowBlur=st.over?12:4;
  ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(cx,cy,R*0.045,0,7);
  ctx.fillStyle=night?"#0a0e12":"#fff"; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=status; ctx.stroke();

  /* digital speed */
  ctx.fillStyle = st.over ? cOver : cInk;
  ctx.font=`700 ${Math.round(R*0.30)}px ${css("--font")}`;
  ctx.fillText(Math.round(spd), cx, cy+R*0.34);
  ctx.font=`600 ${Math.round(R*0.075)}px ${css("--font")}`;
  ctx.fillStyle=cDim;
  ctx.fillText(unitLbl(), cx, cy+R*0.50);

  /* the limit roundel — European speed sign */
  const ry=cy+R*0.74, rr=R*0.135;
  ctx.beginPath(); ctx.arc(cx,ry,rr,0,7);
  ctx.fillStyle="#fff"; ctx.fill();
  ctx.lineWidth=rr*0.30;
  ctx.strokeStyle = limU!=null ? "#d21f2b" : (L.none ? cDim : cLine);
  ctx.stroke();
  ctx.fillStyle="#111";
  if (limU!=null){
    ctx.font=`800 ${Math.round(rr*(limU>=100?0.82:0.98))}px ${css("--font")}`;
    ctx.fillText(limU, cx, ry+rr*0.03);
  } else {
    ctx.font=`800 ${Math.round(rr*0.9)}px ${css("--font")}`;
    ctx.fillText(L.none ? "\u2014" : "?", cx, ry+rr*0.03);
  }
  if (limU==null && !L.none){
    ctx.font=`600 ${Math.round(R*0.058)}px ${css("--font")}`;
    ctx.fillStyle=cDim; ctx.fillText("no limit data here", cx, ry+rr+R*0.075);
  }

  /* over-limit banner */
  if (st.over){
    ctx.font=`800 ${Math.round(R*0.088)}px ${css("--font")}`;
    ctx.fillStyle=cOver;
    ctx.fillText("SLOW DOWN", cx, cy-R*0.36);
  }
}

function loop(){
  st.dispKmh += (st.speedKmh-st.dispKmh)*0.14;        // needle easing
  if (Math.abs(st.speedKmh-st.dispKmh)<0.05) st.dispKmh=st.speedKmh;
  drawGauge();
  requestAnimationFrame(loop);
}

/* =====================================================================
   Map — minimal OSM slippy-tile renderer on canvas (no library, no key)
   ===================================================================== */
const TILE_URL = (z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const view = { lat:52.3702, lon:4.8952, z:16 };       // dragged/zoomed viewpoint
const MINZ=3, MAXZ=19;
const tiles = new Map();                              // "z/x/y" -> {img, ok}
let mapW=0, mapH=0, mapDirty=true;
const filterOK = ("filter" in mtx);

function sizeMap(){
  const box=$("mapWrap").getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2.5);
  mapW=box.width; mapH=box.height;
  mapCv.width=Math.round(mapW*dpr); mapCv.height=Math.round(mapH*dpr);
  mtx.setTransform(dpr,0,0,dpr,0,0);
  scheduleMap();
}
/* Web Mercator: lat/lon <-> tile coords at integer zoom */
const lon2tx=(lon,z)=>(lon+180)/360*(1<<z);
const lat2ty=(lat,z)=>{ const r=lat*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*(1<<z); };
const tx2lon=(x,z)=>x/(1<<z)*360-180;
const ty2lat=(y,z)=>{ const n=Math.PI-2*Math.PI*y/(1<<z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
const mPerPx=(lat,z)=>40075016.686*Math.cos(lat*Math.PI/180)/(256*Math.pow(2,z));

function getTile(z,x,y){
  const n=1<<z; x=((x%n)+n)%n;                        // wrap longitude
  if (y<0||y>=n) return null;
  const key=z+"/"+x+"/"+y;
  let t=tiles.get(key);
  if (!t){
    t={img:new Image(), ok:false};
    t.img.onload=()=>{ t.ok=true; scheduleMap(); };
    t.img.src=TILE_URL(z,x,y);
    tiles.set(key,t);
    if (tiles.size>220){                              // evict oldest
      for (const k of tiles.keys()){ tiles.delete(k); if (tiles.size<=180) break; }
    }
  }
  return t;
}
function scheduleMap(){ mapDirty=true; }
function drawMap(){
  if (!mapDirty || !mapW) return;
  mapDirty=false;
  const c = (st.follow && st.lat!=null) ? {lat:st.lat, lon:st.lon} : view;
  const zi = Math.max(MINZ, Math.min(MAXZ, Math.round(view.z)));
  const ts = 256*Math.pow(2, view.z-zi);              // on-screen tile size (fractional zoom)
  const ox = lon2tx(c.lon,zi)*ts - mapW/2;            // world-pixel origin of viewport
  const oy = lat2ty(c.lat,zi)*ts - mapH/2;

  mtx.clearRect(0,0,mapW,mapH);
  if (S.night && filterOK) mtx.filter="invert(1) hue-rotate(180deg) brightness(.91) saturate(.68)";

  const x0=Math.floor(ox/ts), x1=Math.floor((ox+mapW)/ts);
  const y0=Math.floor(oy/ts), y1=Math.floor((oy+mapH)/ts);
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++){
    const dx=x*ts-ox, dy=y*ts-oy;
    const t=getTile(zi,x,y);
    if (t && t.ok){ mtx.drawImage(t.img, dx,dy, ts+0.6,ts+0.6); continue; }
    if (zi>MINZ){                                     // parent-tile fallback while loading
      const p=getTile(zi-1, x>>1, y>>1);
      if (p && p.ok){
        mtx.drawImage(p.img, (x&1)*128,(y&1)*128,128,128, dx,dy, ts+0.6,ts+0.6);
      }
    }
  }
  if (S.night && filterOK) mtx.filter="none";
  if (S.night && !filterOK){                          // composite fallback (older Safari)
    mtx.globalCompositeOperation="difference";
    mtx.fillStyle="#fff"; mtx.fillRect(0,0,mapW,mapH);
    mtx.globalCompositeOperation="source-over";
    mtx.fillStyle="rgba(10,20,30,.18)"; mtx.fillRect(0,0,mapW,mapH);
  }

  /* vehicle: accuracy ring + heading arrow */
  if (st.lat!=null){
    const sx=lon2tx(st.lon,zi)*ts-ox, sy=lat2ty(st.lat,zi)*ts-oy;
    if (st.acc){
      const rpx=Math.min(st.acc/mPerPx(st.lat,view.z), mapW);
      mtx.beginPath(); mtx.arc(sx,sy,rpx,0,7);
      mtx.fillStyle="rgba(22,104,227,.10)"; mtx.fill();
      mtx.lineWidth=1; mtx.strokeStyle="rgba(22,104,227,.35)"; mtx.stroke();
    }
    const col = st.over ? css("--over") : css("--accent");
    mtx.save(); mtx.translate(sx,sy); mtx.rotate(rad(st.heading));
    mtx.beginPath();
    mtx.moveTo(0,-15); mtx.lineTo(10,11); mtx.lineTo(0,5.5); mtx.lineTo(-10,11); mtx.closePath();
    mtx.fillStyle=col; mtx.strokeStyle="#fff"; mtx.lineWidth=2.5; mtx.lineJoin="round";
    mtx.fill(); mtx.stroke(); mtx.restore();
  }
}

/* ---- map gestures: drag, pinch, wheel, zoom buttons ---- */
const ptrs = new Map();
let pinch0=null;
function unfollow(){
  if (st.follow && st.lat!=null){ view.lat=st.lat; view.lon=st.lon; }
  st.follow=false; $("recenter").classList.add("show");
}
mapCv.addEventListener("pointerdown", e=>{
  mapCv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch0={ d:Math.hypot(a.x-b.x,a.y-b.y), z:view.z };
  }
});
mapCv.addEventListener("pointermove", e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  if (ptrs.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    if (Math.hypot(dx,dy)>2){
      unfollow();
      const zi=Math.round(view.z), ts=256*Math.pow(2,view.z-zi);
      view.lon = tx2lon(lon2tx(view.lon,zi)-dx/ts, zi);
      view.lat = ty2lat(lat2ty(view.lat,zi)-dy/ts, zi);
      p.x=e.clientX; p.y=e.clientY; scheduleMap();
    }
  } else if (ptrs.size===2 && pinch0){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    view.z=Math.max(MINZ,Math.min(MAXZ, pinch0.z+Math.log2(d/pinch0.d)));
    scheduleMap();
  }
});
function ptrUp(e){ ptrs.delete(e.pointerId); if (ptrs.size<2) pinch0=null; }
mapCv.addEventListener("pointerup", ptrUp);
mapCv.addEventListener("pointercancel", ptrUp);
mapCv.addEventListener("wheel", e=>{
  e.preventDefault();
  view.z=Math.max(MINZ,Math.min(MAXZ, view.z-e.deltaY*0.0022));
  scheduleMap();
}, {passive:false});
$("zoomIn").onclick =()=>{ view.z=Math.min(MAXZ, view.z+1); scheduleMap(); };
$("zoomOut").onclick=()=>{ view.z=Math.max(MINZ, view.z-1); scheduleMap(); };
$("recenter").onclick=()=>{ st.follow=true; $("recenter").classList.remove("show"); scheduleMap(); };

/* =====================================================================
   Night mode / sound / wake lock
   ===================================================================== */
function applyNight(){
  document.body.classList.toggle("night", S.night);
  $("nightBtn").textContent = S.night ? "\u2600\uFE0F" : "\u{1F319}";
  $("themeColor").content = S.night ? "#0a0e12" : "#f2f3f5";
  scheduleMap();
}
function applySound(){ $("soundBtn").classList.toggle("offState", !S.sound); }
$("nightBtn").onclick=()=>{ S.night=!S.night; persist(); applyNight(); };
$("soundBtn").onclick=()=>{ S.sound=!S.sound; persist(); applySound(); if(S.sound) ensureAudio(); };
$("gearBtn").onclick=openDrawer;

let wakeLock=null;
async function requestWake(){
  try{ if(S.wake && "wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }
  catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") requestWake(); });

/* =====================================================================
   Settings drawer
   ===================================================================== */
function openDrawer(){
  selSeg("unitSeg","data-u",S.unit); selSeg("tolSeg","data-t",String(S.tol));
  $("wakeSw").checked=S.wake; $("demoSw").checked=S.demo;
  $("scrim").classList.add("open"); $("drawer").classList.add("open");
}
function closeDrawer(){ $("scrim").classList.remove("open"); $("drawer").classList.remove("open"); }
function selSeg(id,attr,val){
  [...$(id).children].forEach(b=>b.classList.toggle("sel", b.getAttribute(attr)===val));
}
$("unitSeg").onclick=e=>{ if(e.target.dataset.u) selSeg("unitSeg","data-u",e.target.dataset.u); };
$("tolSeg").onclick =e=>{ if(e.target.dataset.t) selSeg("tolSeg","data-t",e.target.dataset.t); };
function saveSettings(){
  const wasDemo=S.demo;
  S.unit=[...$("unitSeg").children].find(b=>b.classList.contains("sel"))?.dataset.u||"kmh";
  S.tol=parseInt([...$("tolSeg").children].find(b=>b.classList.contains("sel"))?.dataset.t||"3",10);
  S.wake=$("wakeSw").checked; S.demo=$("demoSw").checked;
  persist(); closeDrawer(); requestWake();
  if (S.demo!==wasDemo){ stopGPS(); startGPS(); }
}

/* =====================================================================
   Demo drive — loops a small circuit and ramps speed, for desk testing
   ===================================================================== */
let demoTimer=null;
function startDemo(){
  let lat=52.3702, lon=4.8952, t=0;
  demoTimer=setInterval(()=>{
    t+=0.5;
    const kmh = 30 + 35*Math.sin(t/9) + 18*Math.sin(t/23);   // wanders over/under 50
    const hdg = (t*6)%360, d=(Math.max(kmh,0)/3.6)*0.5;
    lat += Math.cos(hdg*Math.PI/180)*d/111320;
    lon += Math.sin(hdg*Math.PI/180)*d/(111320*Math.cos(lat*Math.PI/180));
    feedFix(lat,lon,5,Math.max(kmh,0),hdg,Date.now());
    if (st.limitKmh==null) st.limitKmh=50;
    st.limitAt=Date.now();
  },500);
  $("gpsTxt").textContent="Demo drive";
  $("gpsDot").className="dot fix";
}
function stopDemo(){ if(demoTimer){ clearInterval(demoTimer); demoTimer=null; } }

/* =====================================================================
   Boot
   ===================================================================== */
function sizeAll(){ sizeGauge(); sizeMap(); }
window.addEventListener("resize", sizeAll);
window.addEventListener("orientationchange", ()=>setTimeout(sizeAll,120));
applyNight(); applySound(); sizeAll();
(function frame(){ drawMap(); requestAnimationFrame(frame); })();
loop();
startGPS(); requestWake();
</script>
</body>
