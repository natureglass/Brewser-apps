<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Waterballs — WebGL2 metaball fluid</title>
<style>
  /* Flat rendering only: solid fills + solid borders. No gradients, shadows, blur, transitions. */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0B0E14;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #c {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #bar {
    position: fixed; top: 12px; left: 12px;
    display: flex; gap: 6px; flex-wrap: wrap;
    z-index: 5;
  }
  #bar button {
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    color: #d8d8d8;
    background: #0a0a0a;
    border: 1px solid #3a3a3a;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  #bar button:hover  { background: #1a1a1a; }
  #bar button:active { background: #2a2a2a; border-color: #6a6a6a; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 26px;
    text-align: center; color: #7d8898;
    font-size: 13px; letter-spacing: .03em;
    font-family: system-ui, -apple-system, sans-serif;
    pointer-events: none; z-index: 4;
  }
  #err {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #e8eaee; background: #0B0E14;
    z-index: 10; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="bCycle">Cycle</button>
  <button id="bReset">Reset</button>
  <button id="bSizeUp">Size +</button>
  <button id="bSizeDown">Size -</button>
  <button id="bFull">Fullscreen</button>
</div>
<div id="err">WebGL2 is not available in this browser.</div>

<script>
(function () {
  'use strict';

  // ---------- WebGL2 setup ----------
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false });
  if (!gl) {
    document.getElementById('err').style.display = 'flex';
    return;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || 'shader compile failed');
    }
    return s;
  }
  function link(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p) || 'link failed');
    }
    return p;
  }

  // Pass 1: splat each ball's field contribution into an offscreen texture (additive).
  const splatVS = `#version 300 es
  layout(location=0) in vec2 aCorner;
  layout(location=1) in vec2 aCenter;
  layout(location=2) in float aRadius;
  uniform vec2 uSim;
  out vec2 vLocal;
  void main() {
    vLocal = aCorner;
    vec2 p = aCenter + aCorner * aRadius;
    vec2 clip = (p / uSim) * 2.0 - 1.0;
    clip.y = -clip.y;
    gl_Position = vec4(clip, 0.0, 1.0);
  }`;

  const splatFS = `#version 300 es
  precision mediump float;
  in vec2 vLocal;
  out vec4 o;
  void main() {
    float d2 = dot(vLocal, vLocal);
    if (d2 > 1.0) discard;
    float f = 1.0 - d2;
    o = vec4(f * f * 0.5, 0.0, 0.0, 1.0);
  }`;

  // Pass 2: threshold the field into flat color bands (edge / fill / dense core).
  const compVS = `#version 300 es
  out vec2 vUV;
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    vUV = p;
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const compFS = `#version 300 es
  precision mediump float;
  in vec2 vUV;
  uniform sampler2D uField;
  uniform vec3 uEdge;
  uniform vec3 uFill;
  uniform vec3 uCore;
  out vec4 o;
  const vec3 BG = vec3(0.043, 0.055, 0.078);  // #0B0E14
  void main() {
    float f = texture(uField, vUV).r;
    vec3 c = BG;
    if (f > 0.30) c = uEdge;
    if (f > 0.35) c = uFill;
    if (f > 0.90) c = uCore;
    o = vec4(c, 1.0);
  }`;

  const progSplat = link(splatVS, splatFS);
  const progComp  = link(compVS, compFS);
  const uSimLoc   = gl.getUniformLocation(progSplat, 'uSim');
  const uFieldLoc = gl.getUniformLocation(progComp, 'uField');
  const uEdgeLoc  = gl.getUniformLocation(progComp, 'uEdge');
  const uFillLoc  = gl.getUniformLocation(progComp, 'uFill');
  const uCoreLoc  = gl.getUniformLocation(progComp, 'uCore');

  // Palette cycle: hue-based (EDGE/FILL/CORE derived from a single
  // rotating hue). Holding the Cycle button advances `paletteHue`
  // continuously so the water smoothly rolls through the rainbow;
  // release stops it wherever it lands. The three tones are the same
  // hue at ascending brightness — matches the original blue palette's
  // dark → mid → bright banding, just rotatable.
  const DEFAULT_HUE = 0.60;    // blue — the demo's original look
  let paletteHue = DEFAULT_HUE;
  let cycling = false;
  const CYCLE_RATE = 0.15;     // hue units per second while held (~6.7s / full loop)
  const scratchEdge = new Float32Array(3);
  const scratchFill = new Float32Array(3);
  const scratchCore = new Float32Array(3);
  function hsvToRgb(h, s, v, out) {
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: out[0] = v; out[1] = t; out[2] = p; break;
      case 1: out[0] = q; out[1] = v; out[2] = p; break;
      case 2: out[0] = p; out[1] = v; out[2] = t; break;
      case 3: out[0] = p; out[1] = q; out[2] = v; break;
      case 4: out[0] = t; out[1] = p; out[2] = v; break;
      default: out[0] = v; out[1] = p; out[2] = q; break;
    }
  }
  function refreshPalette() {
    const h = ((paletteHue % 1) + 1) % 1;
    hsvToRgb(h, 0.85, 0.48, scratchEdge);
    hsvToRgb(h, 0.72, 0.78, scratchFill);
    hsvToRgb(h, 0.50, 0.96, scratchCore);
  }
  refreshPalette();

  
  // ---------- Particles ----------
  const SEED_N = 100;      // balls at startup
  const MAX_N  = 600;      // hard cap, pointer-spawned balls included
  let count = 0;           // live ball count
  const px = new Float32Array(MAX_N), py = new Float32Array(MAX_N);
  const vx = new Float32Array(MAX_N), vy = new Float32Array(MAX_N);
  // Per-ball physics + render radius. Small balls need a smaller
  // collision footprint too — otherwise their field (~rr wide) never
  // touches a neighbor's field (pair centers can't approach closer
  // than pr[i] + pr[j]), and the small ball renders as an isolated
  // dot instead of merging into the water. Physics loops read pr[i]/
  // pr[j] for minDist and reach; render uses rr[i].
  const pr = new Float32Array(MAX_N);
  const rr = new Float32Array(MAX_N);
  const instData = new Float32Array(MAX_N * 3); // cx, cy, renderRadius

  let W = 1, H = 1;         // sim size (CSS px)
  let PR = 12;              // physics radius
  let RR = 30;              // render (field) radius = PR * 2.5
  let minDist = 24, minDist2 = 576;
  let reach = 36, reach2 = 1296; // viscosity/cohesion reach
  let GRAV = 2200;
  // Multiplier applied to a newly-spawned ball's RENDER radius (RR).
  // 1.0 = default, up to ~2.5 or down to ~0.5 via the HUD buttons. Only
  // affects balls spawned AFTER the button click — existing balls keep
  // whatever rr they were seeded/spawned with.
  let spawnSizeMul = 1.0;
  const SIZE_STEP = 1.18;    // per click
  const SIZE_MIN  = 0.5;
  const SIZE_MAX  = 2.5;

  function computeScale() {
    const m = Math.min(W, H);
    PR = Math.min(18, Math.max(6, m * 0.024));
    RR = PR * 2.5;
    minDist = PR * 2.0; minDist2 = minDist * minDist;
    reach = minDist * 1.6; reach2 = reach * reach;
    GRAV = m * 3.2;
  }

  function seed() {
    count = SEED_N;
    const sp = minDist * 0.95;
    const maxCols = Math.max(4, Math.floor((W - PR * 2) / sp) + 1);
    const cols = Math.min(maxCols, Math.max(4, Math.round(Math.sqrt(SEED_N * (W / H)))));
    const rows = Math.ceil(SEED_N / cols);
    const x0 = W * 0.5 - (cols - 1) * sp * 0.5;
    const y0 = H * 0.72 - (rows - 1) * sp;
    for (let k = 0; k < SEED_N; k++) {
      const c = k % cols, r = (k / cols) | 0;
      px[k] = Math.min(W - PR, Math.max(PR, x0 + c * sp + (Math.random() - 0.5) * 2));
      py[k] = Math.min(H - PR, Math.max(PR, y0 + r * sp + (Math.random() - 0.5) * 2));
      vx[k] = 0; vy[k] = 0;
      pr[k] = PR;
      rr[k] = RR;
    }
  }

  // ---------- GL buffers / targets ----------
  const vaoSplat = gl.createVertexArray();
  const vaoEmpty = gl.createVertexArray();
  const cornerBuf = gl.createBuffer();
  const instBuf = gl.createBuffer();

  gl.bindVertexArray(vaoSplat);
  gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, instData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 12, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 12, 8);
  gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);

  const fieldTex = gl.createTexture();
  const fieldFBO = gl.createFramebuffer();
  let FW = 1, FH = 1;

  function allocField(w, h) {
    FW = Math.max(1, w); FH = Math.max(1, h);
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FW, FH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fieldFBO);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fieldTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  let seeded = false;
  function resize() {
    const oldW = W, oldH = H;
    W = Math.max(1, canvas.clientWidth || window.innerWidth);
    H = Math.max(1, canvas.clientHeight || window.innerHeight);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    computeScale();
    allocField(Math.round(canvas.width * 0.5), Math.round(canvas.height * 0.5));
    if (!seeded) {
      seed();
      seeded = true;
    } else {
      const sx = W / oldW, sy = H / oldH;
      for (let i = 0; i < count; i++) {
        const p = pr[i] || PR;
        px[i] = Math.min(W - p, Math.max(p, px[i] * sx));
        py[i] = Math.min(H - p, Math.max(p, py[i] * sy));
      }
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Input: pointer drag + top-half spawning ----------
  const ptr = { x: 0, y: 0, vx: 0, vy: 0, t: 0, active: false };

  // Clicking/holding in the top half of the canvas spawns new balls at the cursor.
  const SPAWN_BURST = 2;       // balls per spawn tick
  const SPAWN_INTERVAL = 45;   // ms between ticks while held
  let lastSpawn = 0;

  function inSpawnZone(y) { return y < H * 0.5; }

  function spawnAt(x, y) {
    const spawnPR = PR * spawnSizeMul;
    for (let i = 0; i < SPAWN_BURST && count < MAX_N; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * PR * 1.5;
      const k = count++;
      px[k] = Math.min(W - spawnPR, Math.max(spawnPR, x + Math.cos(a) * r));
      py[k] = Math.min(H - spawnPR, Math.max(spawnPR, y + Math.sin(a) * r));
      vx[k] = ptr.vx * 0.5 + (Math.random() - 0.5) * 80;
      vy[k] = ptr.vy * 0.5 + (Math.random() - 0.5) * 80;
      pr[k] = spawnPR;
      rr[k] = RR * spawnSizeMul;
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptr.active = true;
    ptr.x = e.clientX; ptr.y = e.clientY;
    ptr.vx = 0; ptr.vy = 0;
    ptr.t = performance.now();
    if (inSpawnZone(e.clientY)) {
      spawnAt(e.clientX, e.clientY);
      lastSpawn = ptr.t;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!ptr.active) return;
    const t = performance.now();
    const dt = Math.max(1, t - ptr.t) / 1000;
    const ivx = (e.clientX - ptr.x) / dt;
    const ivy = (e.clientY - ptr.y) / dt;
    ptr.vx += (ivx - ptr.vx) * 0.5;
    ptr.vy += (ivy - ptr.vy) * 0.5;
    ptr.x = e.clientX; ptr.y = e.clientY;
    ptr.t = t;
    if (inSpawnZone(e.clientY) && t - lastSpawn >= SPAWN_INTERVAL) {
      spawnAt(e.clientX, e.clientY);
      lastSpawn = t;
    }
  });
  function ptrEnd() { ptr.active = false; ptr.vx = 0; ptr.vy = 0; }
  canvas.addEventListener('pointerup', ptrEnd);
  canvas.addEventListener('pointercancel', ptrEnd);

  // Gravity direction — pure downward, no tilt sensor input.
  const gx = 0, gy = 1;

  // ---------- Simulation ----------
  const SUBSTEPS = 2;
  const RELAX_ITERS = 3;
  const VISC = 4.0;     // neighbor velocity smoothing rate
  const COH = 70;       // cohesion accel in the outer band
  const LIN_DAMP = 0.25;
  const REST = 0.25;    // wall restitution

  function substep(dt) {
    // Gravity (constant downward) + global damping
    const ax = gx * GRAV, ay = gy * GRAV;
    const damp = Math.max(0, 1 - LIN_DAMP * dt);
    for (let i = 0; i < count; i++) {
      vx[i] = (vx[i] + ax * dt) * damp;
      vy[i] = (vy[i] + ay * dt) * damp;
    }

    // Pointer: particles near the touch inherit its velocity + a gentle pull
    if (ptr.active) {
      const R = PR * 9, R2 = R * R;
      for (let i = 0; i < count; i++) {
        const dx = ptr.x - px[i], dy = ptr.y - py[i];
        const d2 = dx * dx + dy * dy;
        if (d2 > R2) continue;
        const w = 1 - Math.sqrt(d2) / R;
        const kk = 1 - Math.exp(-10 * dt * w);
        vx[i] += (ptr.vx - vx[i]) * kk + dx * 5 * dt * w;
        vy[i] += (ptr.vy - vy[i]) * kk + dy * 5 * dt * w;
      }
    }

    // Pairwise viscosity + cohesion (velocity pass). Per-pair distances
    // are (pr[i] + pr[j]) — matches the seed-time uniform-radius math
    // (minDist = 2*PR, reach = 3.2*PR) but scales per-ball so a small
    // ball can approach a bigger neighbor close enough for their fields
    // to overlap and render as merged water.
    for (let i = 0; i < count; i++) {
      for (let j = i + 1; j < count; j++) {
        const dx = px[j] - px[i], dy = py[j] - py[i];
        const d2 = dx * dx + dy * dy;
        const pairMin = pr[i] + pr[j];
        const pairReach = pairMin * 1.6;
        const pairReach2 = pairReach * pairReach;
        if (d2 > pairReach2 || d2 < 1e-9) continue;
        const d = Math.sqrt(d2);
        const w = 1 - d / pairReach;
        const kv = Math.min(0.5, VISC * dt * w);
        const rvx = vx[j] - vx[i], rvy = vy[j] - vy[i];
        vx[i] += rvx * kv; vy[i] += rvy * kv;
        vx[j] -= rvx * kv; vy[j] -= rvy * kv;
        if (d > pairMin) {
          const nx = dx / d, ny = dy / d;
          const ac = COH * dt * w;
          vx[i] += nx * ac; vy[i] += ny * ac;
          vx[j] -= nx * ac; vy[j] -= ny * ac;
        }
      }
    }

    // Integrate
    for (let i = 0; i < count; i++) {
      px[i] += vx[i] * dt;
      py[i] += vy[i] * dt;
    }

    // Positional overlap relaxation
    for (let it = 0; it < RELAX_ITERS; it++) {
      for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
          const dx = px[j] - px[i], dy = py[j] - py[i];
          const d2 = dx * dx + dy * dy;
          const pairMin = pr[i] + pr[j];
          const pairMin2 = pairMin * pairMin;
          if (d2 >= pairMin2 || d2 < 1e-9) continue;
          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          const push = (pairMin - d) * 0.42;
          px[i] -= nx * push; py[i] -= ny * push;
          px[j] += nx * push; py[j] += ny * push;
          if (it === 0) {
            const rvn = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny;
            if (rvn < 0) {
              const c = rvn * 0.25;
              vx[i] += nx * c; vy[i] += ny * c;
              vx[j] -= nx * c; vy[j] -= ny * c;
            }
          }
        }
      }
    }

    // Walls — each ball clamps against the viewport with its OWN
    // physics radius so tiny balls can still settle right against the
    // floor without a chromeHeight-sized gap.
    for (let i = 0; i < count; i++) {
      const p = pr[i];
      if (px[i] < p)         { px[i] = p;         if (vx[i] < 0) vx[i] *= -REST; vy[i] *= 0.98; }
      else if (px[i] > W - p){ px[i] = W - p;     if (vx[i] > 0) vx[i] *= -REST; vy[i] *= 0.98; }
      if (py[i] < p)         { py[i] = p;         if (vy[i] < 0) vy[i] *= -REST; vx[i] *= 0.98; }
      else if (py[i] > H - p){ py[i] = H - p;     if (vy[i] > 0) vy[i] *= -REST; vx[i] *= 0.98; }
    }
  }

  // ---------- Render ----------
  function render() {
    for (let i = 0; i < count; i++) {
      instData[i * 3]     = px[i];
      instData[i * 3 + 1] = py[i];
      instData[i * 3 + 2] = rr[i];
    }

    // Pass 1: field accumulation
    gl.bindFramebuffer(gl.FRAMEBUFFER, fieldFBO);
    gl.viewport(0, 0, FW, FH);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(progSplat);
    gl.uniform2f(uSimLoc, W, H);
    gl.bindVertexArray(vaoSplat);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData.subarray(0, count * 3));
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);

    // Pass 2: flat-band composite
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.disable(gl.BLEND);
    gl.useProgram(progComp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.uniform1i(uFieldLoc, 0);
    gl.uniform3f(uEdgeLoc, scratchEdge[0], scratchEdge[1], scratchEdge[2]);
    gl.uniform3f(uFillLoc, scratchFill[0], scratchFill[1], scratchFill[2]);
    gl.uniform3f(uCoreLoc, scratchCore[0], scratchCore[1], scratchCore[2]);
    gl.bindVertexArray(vaoEmpty);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  // ---------- HUD ----------
  // Cycle is a HOLD button: press and hold to rotate the palette hue
  // continuously, release to stop. Mirrors fractalszoom's Cycle. The
  // `pointercancel` handler covers the "cursor drifted off + pointer
  // capture released it" case so cycling doesn't get stuck on.
  const bCycle = document.getElementById('bCycle');
  bCycle.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { bCycle.setPointerCapture(e.pointerId); } catch (_) {}
    cycling = true;
  });
  bCycle.addEventListener('pointerup',     () => { cycling = false; });
  bCycle.addEventListener('pointercancel', () => { cycling = false; });
  document.getElementById('bReset').addEventListener('click', () => {
    // Full reset: re-seed the grid, drop pointer momentum, restore
    // default hue + spawn size, stop any hold-cycle in progress.
    paletteHue = DEFAULT_HUE;
    refreshPalette();
    cycling = false;
    spawnSizeMul = 1.0;
    ptr.active = false;
    ptr.vx = 0; ptr.vy = 0;
    seed();
  });
  document.getElementById('bSizeUp').addEventListener('click', () => {
    spawnSizeMul = Math.min(SIZE_MAX, spawnSizeMul * SIZE_STEP);
  });
  document.getElementById('bSizeDown').addEventListener('click', () => {
    spawnSizeMul = Math.max(SIZE_MIN, spawnSizeMul / SIZE_STEP);
  });
  function isEffectivelyFullscreen() {
    return !!document.fullscreenElement
      || matchMedia('(display-mode: fullscreen)').matches
      || (innerWidth === screen.width && innerHeight === screen.height);
  }

  function canRequestFullscreen() {
    return document.fullscreenEnabled && !isEffectivelyFullscreen();
  }

  const bFull = document.getElementById('bFull');
  function updateFullscreenLabel() {
    bFull.textContent = isEffectivelyFullscreen() ? 'Exit Fullscreen' : 'Enter Fullscreen';
  }
  updateFullscreenLabel();
  bFull.addEventListener('click', async () => {
    if (isEffectivelyFullscreen()) {
      await document.exitFullscreen();
    } else if (canRequestFullscreen()) {
      await document.documentElement.requestFullscreen();
    }
    updateFullscreenLabel();
  });
  document.addEventListener('fullscreenchange', updateFullscreenLabel);
  window.addEventListener('resize', updateFullscreenLabel);

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(t) {
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.033) dt = 0.033;
    if (dt > 0) {
      // Pointer velocity decays between move events so it doesn't fling forever
      const dec = Math.exp(-6 * dt);
      ptr.vx *= dec; ptr.vy *= dec;
      const h = dt / SUBSTEPS;
      for (let s = 0; s < SUBSTEPS; s++) substep(h);
    }
    if (cycling) {
      paletteHue += CYCLE_RATE * dt;
      refreshPalette();
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
